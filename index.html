        /* ═══════════════ ۹. سلاخ‌خونه — کثیف، زنگ‌زده، پر از خون و لجن (+۱۸) ═══════════════ */
        body.theme-slaughterhouse {
            --bg: #1a0a05;
            --surface: #1c0c07;
            --surface2: #220e09;
            --border: #5a2a1a;
            --text: #d0b8a8;
            --text-light: #b09888;
            --accent: #8b1a0a;
            --accent-glow: #cc2200;
            --font-main: 'Creepster', 'Walter Turncoat', 'Lalezar', cursive;
            --font-serif: 'Crimson Text', serif;
            --font-mono: 'Special Elite', monospace;
            --font-cinema: 'Creepster', 'IM Fell English SC', cursive;
            --blood-opacity: 0.35;
            --axe-opacity: 0.35;
            --btn-size: 36px;
            --transition: 0.3s ease;
            --location-size: 18px;
            --card-bg: linear-gradient(180deg, #1c0c07 0%, #140804 100%);
            --card-border: #5a2a1a;
            --card-shadow: 0 20px 60px rgba(139,0,0,0.5), 0 0 0 2px rgba(139,0,0,0.2);
            --frame-bg: transparent;
            --frame-border: 4px solid #3a1a0a;
            --frame-padding: 20px;
            --btn-bg: linear-gradient(135deg, #3a1a0a, #1a0505);
            --btn-border: #6a2a1a;
            --btn-text: #ffccaa;
            --btn-hover-border: #ff2200;
            --btn-hover-shadow: 0 6px 25px rgba(255,0,0,0.6);
            --blood-visibility: visible;
            --weapon-visibility: visible;
            --mist-visibility: visible;

            /* بافت زنگ‌زده و کثیف */
            background-color: #1a0a05;
            background-image: 
                /* زنگ فلز */
                radial-gradient(ellipse at 20% 30%, rgba(120, 60, 20, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(100, 40, 10, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(80, 30, 10, 0.4) 0%, transparent 70%),
                /* لکه‌های خون خشکیده */
                radial-gradient(circle at 15% 80%, rgba(80, 0, 0, 0.7) 0%, transparent 25%),
                radial-gradient(circle at 85% 20%, rgba(60, 0, 0, 0.6) 0%, transparent 30%),
                radial-gradient(circle at 60% 90%, rgba(90, 0, 0, 0.5) 0%, transparent 20%),
                radial-gradient(circle at 40% 15%, rgba(70, 0, 0, 0.55) 0%, transparent 22%),
                /* خون تازه (قرمزتر) */
                radial-gradient(ellipse at 10% 50%, rgba(120, 0, 0, 0.5) 0%, transparent 18%),
                radial-gradient(ellipse at 90% 60%, rgba(110, 0, 0, 0.45) 0%, transparent 20%),
                /* لجن و کپک */
                radial-gradient(ellipse at 25% 65%, rgba(30, 40, 10, 0.5) 0%, transparent 35%),
                radial-gradient(ellipse at 75% 35%, rgba(25, 35, 8, 0.45) 0%, transparent 30%),
                /* بافت زنگ‌زدگی ریز */
                repeating-linear-gradient(45deg, rgba(60,20,5,0.15) 0px, rgba(60,20,5,0.15) 2px, transparent 2px, transparent 8px),
                repeating-linear-gradient(-45deg, rgba(40,15,5,0.1) 0px, rgba(40,15,5,0.1) 1px, transparent 1px, transparent 6px);
            background-size: cover;
            background-attachment: fixed;
        }

        /* ═══════════════ استایل کلی ═══════════════ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.6s, color 0.6s;
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ═══════════════ قاب CRT ═══════════════ */
        .crt-frame {
            display: none;
            position: relative;
            background: var(--frame-bg);
            border: var(--frame-border);
            border-radius: 18px;
            padding: var(--frame-padding);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 20px 50px rgba(0,0,0,0.8);
        }
        body.theme-terminal .crt-frame,
        body.theme-morgue .crt-frame,
        body.theme-interrogation .crt-frame,
        body.theme-slaughterhouse .crt-frame {
            display: block;
        }

        /* ═══════════════ چکیدن خون Canvas ═══════════════ */
        #bloodCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: var(--blood-opacity);
            transition: opacity 0.8s;
        }

        /* ═══════════════ سلاح‌های شناور واقع‌گرایانه ═══════════════ */
        .weapon-real {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 1.5s, transform 2s;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.7));
        }
        .weapon-real.visible {
            opacity: var(--axe-opacity);
        }
        .weapon-real.axe1 { top: 5%; left: 3%; width: 80px; height: 80px; }
        .weapon-real.axe2 { top: 70%; right: 2%; width: 65px; height: 65px; }
        .weapon-real.gun1 { bottom: 10%; left: 8%; width: 90px; height: 60px; }
        .weapon-real.gun2 { top: 40%; right: 5%; width: 75px; height: 50px; }
        .weapon-real.knife1 { top: 30%; left: 88%; width: 50px; height: 70px; }

        /* ═══════════════ ابر مه ═══════════════ */
        .mist-overlay {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(100,80,60,0.04) 0%, transparent 70%);
            animation: mistDrift 15s ease-in-out infinite;
        }
        @keyframes mistDrift {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.12); }
        }

        /* ═══════════════ wrapper ═══════════════ */
        .app-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 0 5px;
        }
        .mini-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .mini-btn:hover { border-color: var(--accent); color: #fff; box-shadow: 0 0 14px var(--accent-glow); }
        .mini-btn.playing { border-color: var(--accent); animation: musicPulse 1.5s infinite; }
        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 0 5px var(--accent-glow); }
            50% { box-shadow: 0 0 20px var(--accent-glow); }
        }

        .game-container {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 4px;
            box-shadow: var(--card-shadow);
            min-height: 500px;
            max-height: 85vh;
            overflow-y: auto;
            transition: all 0.5s;
            scroll-behavior: smooth;
            position: relative;
        }
        .game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 5;
        }
        .game-title {
            font-family: var(--font-cinema);
            color: var(--accent);
            font-size: 24px;
            letter-spacing: 6px;
            text-shadow: 0 0 15px var(--accent-glow);
        }
        .status-pills {
            display: flex;
            gap: 15px;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-light);
            font-family: var(--font-mono);
        }

        .location {
            font-family: var(--font-cinema);
            font-size: var(--location-size);
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 26px;
            opacity: 0.9;
            font-weight: 600;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .scene-text {
            font-size: 16px;
            line-height: 2.5;
            color: var(--text);
            margin-bottom: 24px;
            font-family: var(--font-serif);
        }
        .dialogue-box {
            padding: 18px 22px;
            margin-bottom: 28px;
            border-right: 3px solid var(--accent);
            background: linear-gradient(90deg, rgba(139,58,58,0.06) 0%, transparent 100%);
            font-style: italic;
            color: var(--text-light);
            line-height: 2.4;
            border-radius: 0 3px 3px 0;
            font-family: var(--font-serif);
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            bottom: 0;
            background: var(--surface);
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        .choice-btn {
            width: 100%;
            text-align: right;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--btn-border);
            padding: 15px 22px;
            font-family: var(--font-main);
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 3px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .choice-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 3px;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .choice-btn:hover {
            border-color: var(--btn-hover-border);
            color: #fff;
            transform: translateX(-6px);
            box-shadow: var(--btn-hover-shadow);
        }
        .choice-btn:hover::before { opacity: 1; }

        .game-footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-light);
            opacity: 0.5;
            font-family: var(--font-mono);
        }

        .tutorial-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.94);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tutorial-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            border-radius: 4px;
            text-align: center;
            font-family: var(--font-main);
        }
        .tutorial-box h2 {
            font-family: var(--font-cinema);
            color: var(--accent);
            letter-spacing: 6px;
            margin-bottom: 25px;
            font-size: 26px;
        }
        .tutorial-box p { line-height: 2.2; margin-bottom: 15px; color: var(--text-light); }
        .tutorial-box .start-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-family: var(--font-cinema);
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 4px;
            margin-top: 20px;
            transition: var(--transition);
            border-radius: 3px;
        }
        .tutorial-box .start-btn:hover { box-shadow: 0 0 25px var(--accent-glow); }

        @media (max-width: 600px) {
            .game-container { padding: 20px 15px; }
            .game-title { font-size: 16px; }
            .scene-text { font-size: 14px; }
            .location { font-size: 12px; }
            body.theme-newspaper .game-container { column-count: 1; }
        }
    </style>
</head>
<body class="theme-classic">

    <!-- قاب CRT -->
    <div class="crt-frame" id="crtFrame">
        <div class="app-wrapper"></div>
    </div>

    <!-- سلاح‌های شناور -->
    <div class="weapon-real axe1 visible" id="weapon1">
        <svg viewBox="0 0 100 100"><defs><linearGradient id="m1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#888"/><stop offset="50%" style="stop-color:#444"/><stop offset="100%" style="stop-color:#222"/></linearGradient></defs><rect x="35" y="10" width="8" height="80" rx="2" fill="#5a3a2a"/><path d="M25 15 L55 5 L58 25 L28 35 Z" fill="url(#m1)"/></svg>
    </div>
    <div class="weapon-real axe2 visible" id="weapon2">
        <svg viewBox="0 0 100 100"><defs><linearGradient id="m2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#999"/><stop offset="50%" style="stop-color:#555"/><stop offset="100%" style="stop-color:#333"/></linearGradient></defs><rect x="38" y="5" width="7" height="85" rx="2" fill="#4a2a1a"/><path d="M20 10 L60 0 L62 30 L22 40 Z" fill="url(#m2)"/></svg>
    </div>
    <div class="weapon-real gun1 visible" id="weapon3">
        <svg viewBox="0 0 120 80"><defs><linearGradient id="m3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#777"/><stop offset="50%" style="stop-color:#333"/><stop offset="100%" style="stop-color:#111"/></linearGradient></defs><rect x="10" y="25" width="90" height="15" rx="3" fill="url(#m3)"/><rect x="100" y="20" width="15" height="8" rx="2" fill="#444"/><rect x="15" y="40" width="20" height="10" rx="2" fill="#2a1a0a"/></svg>
    </div>
    <div class="weapon-real gun2 visible" id="weapon4">
        <svg viewBox="0 0 100 70"><defs><linearGradient id="m4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#666"/><stop offset="50%" style="stop-color:#222"/><stop offset="100%" style="stop-color:#000"/></linearGradient></defs><rect x="5" y="20" width="80" height="12" rx="3" fill="url(#m4)"/><rect x="85" y="18" width="12" height="7" rx="2" fill="#333"/></svg>
    </div>

    <!-- ابر مه -->
    <div class="mist-overlay"></div>

    <!-- Canvas خون -->
    <canvas id="bloodCanvas"></canvas>

    <!-- آهنگ‌ها -->
    <audio id="bgMusic1" src="https://dl.just-music.ir/music//Soundtrack/Dark/Dark%20Cycle%201%20(2019)/320/11.%20Gott%20Gib%20Mir%20Gelassenheit.mp3" preload="auto"></audio>
    <audio id="bgMusic2" src="https://dl.just-music.ir/music//Soundtrack/Dark/Dark%20Cycle%202%20(2019)/320/01.%20Schwarze%20Materie.mp3" preload="auto"></audio>

    <div class="app-wrapper" id="mainWrapper">
        <div class="top-bar">
            <button class="mini-btn" id="musicBtn" onclick="toggleMusic()" title="موسیقی">🎵</button>
            <button class="mini-btn" id="themeBtn" onclick="cycleTheme()" title="تغییر تم">🎨</button>
        </div>

        <main class="game-container" id="gameContainer">
            <header class="game-header">
                <h1 class="game-title">آخرین صلیب</h1>
                <div class="status-pills">
                    <span id="clueCount">سرنخ: ۰</span>
                    <span id="timeDisplay">روز: ۱</span>
                </div>
            </header>
            <div class="location" id="location"></div>
            <div class="scene-text" id="sceneText"></div>
            <div class="dialogue-box" id="dialogue"></div>
            <nav class="choices" id="choices"></nav>
            <footer class="game-footer">نورثبروک، اورگن</footer>
        </main>
    </div>

    <div class="tutorial-overlay" id="tutorial">
        <div class="tutorial-box">
            <h2>✞ آخرین صلیب ✞</h2>
            <p>نورثبروک، اورگن. شهر کوچیکی که همه همدیگه رو می‌شناسن.</p>
            <p>تو کارآگاه جیمی مورو هستی. قاتل سریالی رو پیدا کن.</p>
            <p>هر انتخاب تو عواقبی داره.</p>
            <p style="color:var(--accent);">بارون نمی‌ایسته. قاتل هنوز آزاده.</p>
            <button class="start-btn" onclick="startGame()">شروع پرونده</button>
        </div>
    </div>

    <script>
        // ═══════════════ تم‌ها ═══════════════
        const themes = ['theme-classic', 'theme-terminal', 'theme-notebook', 'theme-interrogation', 'theme-morgue', 'theme-newspaper', 'theme-bloodlust', 'theme-neonoir', 'theme-slaughterhouse'];
        let currentTheme = 0;

        function cycleTheme() {
            currentTheme = (currentTheme + 1) % themes.length;
            document.body.className = themes[currentTheme];
            localStorage.setItem('lastCrossTheme', themes[currentTheme]);
            // انتقال محتوا به قاب CRT اگر لازم باشه
            const crtFrame = document.getElementById('crtFrame');
            const mainWrapper = document.getElementById('mainWrapper');
            const needsFrame = ['theme-terminal', 'theme-morgue', 'theme-interrogation', 'theme-slaughterhouse'];
            if (needsFrame.includes(themes[currentTheme])) {
                if (!crtFrame.contains(mainWrapper)) {
                    crtFrame.querySelector('.app-wrapper').appendChild(mainWrapper);
                }
            } else {
                if (crtFrame.contains(mainWrapper)) {
                    document.body.insertBefore(mainWrapper, crtFrame);
                }
            }
        }

        // ═══════════════ موسیقی ═══════════════
        const bgMusic1 = document.getElementById('bgMusic1');
        const bgMusic2 = document.getElementById('bgMusic2');
        const musicBtn = document.getElementById('musicBtn');
        let musicPlaying = false, currentTrack = 1;

        bgMusic1.addEventListener('ended', () => { currentTrack = 2; bgMusic2.play().catch(() => {}); });
        bgMusic2.addEventListener('ended', () => { currentTrack = 1; bgMusic1.play().catch(() => {}); });

        function toggleMusic() {
            if (musicPlaying) {
                bgMusic1.pause(); bgMusic2.pause();
                musicBtn.classList.remove('playing'); musicBtn.innerHTML = '🔇';
            } else {
                (currentTrack === 1 ? bgMusic1 : bgMusic2).play().catch(() => {});
                musicBtn.classList.add('playing'); musicBtn.innerHTML = '🎵';
            }
            musicPlaying = !musicPlaying;
            localStorage.setItem('lastCrossMusic', musicPlaying);
        }

        document.addEventListener('click', function initAudio() {
            if (!musicPlaying) {
                bgMusic1.play().then(() => { musicPlaying = true; musicBtn.classList.add('playing'); musicBtn.innerHTML = '🎵'; }).catch(() => {});
            }
        }, { once: true });

        // ═══════════════ چکیدن خون Canvas ═══════════════
        const canvas = document.getElementById('bloodCanvas');
        const ctx = canvas.getContext('2d');
        let drops = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 30; i++) {
            drops.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height * 0.3, speed: 0.2 + Math.random() * 1.5, size: 1 + Math.random() * 4, opacity: 0.1 + Math.random() * 0.6 });
        }

        function drawBlood() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let d of drops) {
                d.y += d.speed;
                if (d.y > canvas.height + 10) { d.y = -10; d.x = Math.random() * canvas.width; }
                ctx.beginPath();
                ctx.ellipse(d.x, d.y, d.size, d.size * 3.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(120, 0, 0, ${d.opacity})`;
                ctx.fill();
            }
            requestAnimationFrame(drawBlood);
        }
        drawBlood();

        function startGame() {
            document.getElementById('tutorial').style.display = 'none';
            if (typeof loadScene === 'function') loadScene('scene0_flashback');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('lastCrossTheme');
            if (savedTheme && themes.includes(savedTheme)) { document.body.className = savedTheme; currentTheme = themes.indexOf(savedTheme); }
            const savedMusic = localStorage.getItem('lastCrossMusic');
            if (savedMusic === 'true') {
                bgMusic1.play().then(() => { musicPlaying = true; musicBtn.classList.add('playing'); musicBtn.innerHTML = '🎵'; }).catch(() => {});
            }
            // انتقال اولیه برای تم‌های دارای قاب
            const needsFrame = ['theme-terminal', 'theme-morgue', 'theme-interrogation', 'theme-slaughterhouse'];
            if (needsFrame.includes(savedTheme)) {
                const crtFrame = document.getElementById('crtFrame');
                const mainWrapper = document.getElementById('mainWrapper');
                if (!crtFrame.contains(mainWrapper)) {
                    crtFrame.querySelector('.app-wrapper').appendChild(mainWrapper);
                }
            }
        });
    </script>

    <script src="story.js"></script>
</body>
</html>
