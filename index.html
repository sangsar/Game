<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>پرونده‌های جنایی | قاتلان سریالی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0505;
            font-family: 'Courier New', monospace;
            color: #e0d0bc;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #0f0b0b;
            border-radius: 32px;
            border: 1px solid #6b2e2e;
            overflow: hidden;
        }
        .header {
            background: #1a0b0b;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #a03a2a;
        }
        .header h1 { color: #dc8a62; font-family: 'Times New Roman', serif; }
        .case-selector {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 15px;
            background: #0a0505;
        }
        .case-btn {
            background: #1e1212;
            border: 1px solid #8b3c2c;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            color: #e6c8a3;
        }
        .case-btn.active { background: #6b1a1a; border-color: #c97e5a; color: white; }
        .game-area { padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; }
        .evidence-panel {
            flex: 1;
            background: #0e0808;
            padding: 15px;
            border-radius: 24px;
            border: 1px solid #3a2626;
        }
        .evidence-title { color: #dc8a62; border-bottom: 1px solid #6b2e2e; margin-bottom: 15px; }
        .evidence-card {
            background: #160c0c;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 16px;
            cursor: pointer;
            border: 1px solid #5a3737;
        }
        .evidence-card:hover { background: #251515; }
        .evidence-icon { font-size: 2rem; margin-left: 10px; vertical-align: middle; }
        .evidence-detail { display: none; margin-top: 8px; font-size: 0.85rem; color: #bcab8a; border-top: 1px dotted #5a3636; padding-top: 6px; }
        .interrogation-panel {
            flex: 2;
            background: #0e0808;
            padding: 15px;
            border-radius: 24px;
            border: 1px solid #3a2626;
        }
        .narrative {
            background: #040101;
            padding: 18px;
            border-radius: 24px;
            border-right: 4px solid #a0432c;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-area button {
            display: block;
            width: 100%;
            text-align: right;
            background: #1f1515;
            border: 1px solid #734242;
            padding: 12px;
            margin-bottom: 12px;
            color: #f6ebd4;
            border-radius: 20px;
            cursor: pointer;
        }
        .options-area button:hover { background: #412b2b; }
        .feedback {
            background: #1a1010;
            padding: 12px;
            margin-top: 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            border-right: 3px solid #b85a3a;
        }
        .notebook {
            background: #0a0505;
            padding: 12px;
            margin-top: 15px;
            border-radius: 16px;
        }
        .notebook textarea {
            width: 100%;
            background: #1a1010;
            border: 1px solid #6b2e2e;
            color: #e0d0bc;
            padding: 8px;
            border-radius: 12px;
            font-family: monospace;
            resize: vertical;
        }
        .reset-btn {
            background: none;
            border: 1px solid #8b3636;
            padding: 8px 20px;
            margin-top: 20px;
            border-radius: 40px;
            cursor: pointer;
            color: #d1966e;
        }
        .ending-box {
            background: #180e0e;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #c06a48;
            border-radius: 28px;
            display: none;
            text-align: center;
        }
        @media (max-width: 700px) {
            .game-area { flex-direction: column; }
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 16px;
            color: #5c4232;
            border-top: 1px solid #3a1e1e;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🕵️‍♂️ آرشیو قاتلان سریالی</h1>
        <p>پرونده‌های واقعی | بازجویی تعاملی</p>
    </div>
    <div class="case-selector" id="caseSelector">
        <button class="case-btn" data-case="samuel">🔪 ساموئل لیتل (۹۳ قتل)</button>
        <button class="case-btn" data-case="chikatilo">🩸 آندری چیکاتیلو (۵۳ قتل)</button>
    </div>
    <div class="game-area">
        <div class="evidence-panel" id="evidencePanel">
            <div class="evidence-title">📂 مدارک پرونده (کلیک کنید)</div>
            <div id="evidenceList"></div>
        </div>
        <div class="interrogation-panel">
            <div class="narrative" id="narrativeBox">یک پرونده را انتخاب کنید و مدارک را بخوانید، سپس بازجویی را شروع کنید.</div>
            <div id="optionsArea"></div>
            <div class="notebook">
                <label>📓 دفترچه کارآگاه (ذخیره خودکار)</label>
                <textarea id="notebook" rows="2" placeholder="نکته‌ها، شواهد مهم، فرضیات..."></textarea>
            </div>
            <div id="feedbackMsg" class="feedback"></div>
            <button id="resetBtn" class="reset-btn">🗑️ بازنشانی پرونده</button>
            <div id="endingBox" class="ending-box"></div>
        </div>
    </div>
    <footer>بر اساس پرونده‌های واقعی FBI | تصاویر نمادین داخلی</footer>
</div>

<script>
    // ============================================================
    // 1. داده‌های دو قاتل (مدارک کامل، بازجویی مرحله‌ای)
    // ============================================================
    const killers = {
        samuel: {
            name: "ساموئل لیتل",
            fullName: "Samuel Little",
            victims: 93,
            evidence: [
                { icon: "🎨", title: "نقاشی‌های قربانیان", desc: "لیتل در زندان بیش از ۳۰ نقاشی از قربانیانش کشید. اف‌بی‌آی از این نقاشی‌ها برای شناسایی قربانیان ناشناس استفاده کرد." },
                { icon: "🧬", title: "DNA روی لباس قربانیان", desc: "پروژه تگزاس رنجرز DNA لیتل را با بیش از ۳۰ قتل قدیمی تطبیق داد. قربانیان خفه شده بودند و سلول‌های اپیتلیال زیر ناخن‌ها باقی مانده بود." },
                { icon: "🚗", title: "خودروهای کرایه‌ای متعدد", desc: "اسناد کرایه خودرو با اسم مستعار. او ماشین را هر چند هفته عوض می‌کرد تا ردیابی نشود." },
                { icon: "🥊", title: "سابقه بوکس", desc: "لیتل یک بوکسور آماتور بود. قدرت بدنی بالایی داشت و قربانیان را با مشت بیهوش می‌کرد." },
                { icon: "🛣️", title: "رها کردن اجساد در بزرگراه‌ها", desc: "بیشتر اجساد در کنار جاده‌های بین ایالتی رها شده بودند. پلیس ارتباط بین قتل‌ها را نمی‌دید چون لیتل بین ایالت‌ها جابه‌جا می‌شد." }
            ],
            interrogation: [
                {
                    text: "بازجو: لیتل، ما مدارک DNA و نقاشی‌های تو را داریم. چرا زنان بی‌خانمان و روسپی را هدف می‌گرفتی؟ (مدارک را بخوانید)",
                    options: [
                        { text: "«اونها هیچکس براشون مهم نبود. کسی دنبالشون نمی‌گشت.»", correct: true, next: 1, feedback: "✅ درست. خودش گفت جامعه آن‌ها را فراموش کرده بود." },
                        { text: "«از اونا متنفر بودم چون شبیه مادرم بودن.»", correct: false, next: 1, feedback: "❌ نادرست. مدارک نشان می‌دهد نفرت نبود، بلکه فرصت‌طلبی بود." },
                        { text: "«به راحتی سوار ماشین من می‌شدن.»", correct: true, next: 1, feedback: "✅ بله، آسیب‌پذیری و اعتماد ساده هدفش بود." }
                    ]
                },
                {
                    text: "بازجو: چطور موفق می‌شدی بدون به جا گذاشتن اثر، اجساد را رها کنی؟",
                    options: [
                        { text: "«خودرو کرایه می‌کردم با اسم جعلی و هر بار شهر عوض می‌کردم.»", correct: true, next: 2, feedback: "✅ مدارک کرایه خودرو تایید می‌کند. او ۷۰ خودرو مختلف داشته." },
                        { text: "«جسدها رو توی چاه می‌انداختم.»", correct: false, next: 2, feedback: "❌ بیشتر اجساد در کنار جاده پیدا شدند." },
                        { text: "«با قطار سفر می‌کردم و جسد رو ول می‌کردم.»", correct: false, next: 2, feedback: "❌ او از خودرو استفاده می‌کرد چون خودش راننده بود." }
                    ]
                },
                {
                    text: "بازجو: آیا از کشتن لذت می‌بردی؟ نقاشی‌هایت چه معنایی دارند؟",
                    options: [
                        { text: "«نقاشی کشیدن مثل مالک شدن دوباره اونها بود. لذت‌آور بود.»", correct: true, next: 3, feedback: "✅ در اعترافاتش گفت: 'چشماشون که خالی می‌شد، مال من می‌شدن.'" },
                        { text: "«نقاشی برای فراموشی گناهم بود.»", correct: false, next: 3, feedback: "❌ او هیچ پشیمانی نداشت. نقاشی‌ها بخشی از فتیش یادبود بود." },
                        { text: "«می‌خواستم پلیس رو مسخره کنم.»", correct: false, next: 3, feedback: "❌ او نقاشی‌ها را پنهان می‌کرد تا سال‌ها." }
                    ]
                },
                {
                    text: "بازجو: شما سابقه بوکس دارید. چرا از زور فیزیکی استفاده می‌کردید نه اسلحه؟",
                    options: [
                        { text: "«با مشتم می‌تونستم سریع بیهوششون کنم، بی‌صدا.»", correct: true, next: 4, feedback: "✅ قدرت بدنی بالا و روش بی‌صدا." },
                        { text: "«از خون متنفر بودم.»", correct: false, next: 4, feedback: "❌ او با خفگی کاری به خون نداشت." },
                        { text: "«اسلحه پیدا نمی‌کردم.»", correct: false, next: 4, feedback: "❌ عمداً روش خاموش را انتخاب می‌کرد." }
                    ]
                },
                {
                    text: "بازجو: حالا که محکوم شدی، حرف آخر؟ آیا قربانیان ناشناس دیگری هم هستند؟",
                    options: [
                        { text: "«هشتاد و چند نفر رو یادم هست. بقیه رو فراموش کردم. نقاشی‌ها رو نگاه کنید.»", correct: true, next: -1, feedback: "✅ اف‌بی‌آی ۹۳ قتل را تأیید کرد. نقاشی‌ها کلید شناسایی بودند." },
                        { text: "«فقط همونی که اعتراف کردم.»", correct: false, next: -1, feedback: "❌ لیتل به بیش از ۹۰ قتل اعتراف کرد." },
                        { text: "«هیچی دیگه.»", correct: false, next: -1, feedback: "❌ او بعداً نقاشی‌های بیشتری کشید." }
                    ]
                }
            ]
        },
        chikatilo: {
            name: "آندری چیکاتیلو",
            fullName: "Andrei Chikatilo",
            victims: 53,
            evidence: [
                { icon: "🔪", title: "چاقوی قتل", desc: "چاقویی با تیغه ۱۵ سانتی‌متر که اثر دندانه روی دسته داشت. روی چندین جسد اثر برش مشابه پیدا شد." },
                { icon: "🚉", title: "ایستگاه قطار روستوف", desc: "چیکاتیلو قربانیان را در ایستگاه‌های قطار شکار می‌کرد. شاهدان گفتند مردی میانسال با چمدان کوچک به کودکان نزدیک می‌شد." },
                { icon: "🧥", title: "اثر خون روی کت کار", desc: "کت قهوه‌ای که در خانه چیکاتیلو یافت شد. لکه‌های خون گروه خونی A (مربوط به قربانیان) – گروه خونی خود او O بود." },
                { icon: "📝", title: "دفترچه یادداشت با رمز", desc: "پلیس دفترچه‌ای با اعداد و ارقام پیدا کرد که بعداً مشخص شد تاریخ و تعداد دفعات قتل را نشان می‌دهد. او ۵۶ بار علامت زده بود." },
                { icon: "🦷", title: "گاز گرفتگی", desc: "پزشکی قانونی آثار گاز گرفتگی روی شانه یک قربانی ثبت کرد که با مدل دندان چیکاتیلو تطابق داشت." }
            ],
            interrogation: [
                {
                    text: "بازجو: چیکاتیلو، ما چاقوی قتل و لکه‌های خون روی کتت را داریم. چرا کودکان و زنان جوان؟",
                    options: [
                        { text: "«تنها وقتی چاقو می‌زدم، ارضا می‌شدم. بچه‌ها راحت‌تر اعتماد می‌کردن.»", correct: true, next: 1, feedback: "✅ اعترافات روانپزشکی: ناتوانی جنسی مگر با خشونت مرگبار." },
                        { text: "«از بچگی از همه متنفر بودم.»", correct: false, next: 1, feedback: "❌ علت اختلال شدید سادیسم جنسی بود نه نفرت عمومی." },
                        { text: "«برای پول این کارو می‌کردم.»", correct: false, next: 1, feedback: "❌ هیچ مدرکی از سرقت نیست." }
                    ]
                },
                {
                    text: "بازجو: شاهدان گفتند تو را نزدیک ایستگاه قطار با چمدان دیده‌اند. چی توی چمدانت بود؟",
                    options: [
                        { text: "«چاقو، طناب و یک پارچه برای تمیز کردن دستم.»", correct: true, next: 2, feedback: "✅ کارآگاهان چاقو و پارچه آغشته به خون پیدا کردند." },
                        { text: "«لباس عادی و کتاب.»", correct: false, next: 2, feedback: "❌ او ابزار قتل را حمل می‌کرد." },
                        { text: "«مواد غذایی برای قربانیان.»", correct: false, next: 2, feedback: "❌ کاملاً غلط." }
                    ]
                },
                {
                    text: "بازجو: چرا اجساد را مثله می‌کردی؟",
                    options: [
                        { text: "«با مثله کردن، اونا رو برای همیشه مال خودم می‌کردم. چشمهاشون... منو می‌دیدند.»", correct: true, next: 3, feedback: "✅ روانشناسان: فتیش چشمان قربانی." },
                        { text: "«برای ترساندن پلیس.»", correct: false, next: 3, feedback: "❌ هدف ارضای نیازهای بیمارگونه بود." },
                        { text: "«احساس می‌کردم هیولا هستم.»", correct: false, next: 3, feedback: "❌ او در بازجویی گفت: 'من از خودم متنفرم اما لذت می‌برم.'" }
                    ]
                },
                {
                    text: "بازجو: مدرک گاز گرفتگی روی شانه یک پسر با دندان‌هایت تطابق دارد. اعتراف می‌کنی؟",
                    options: [
                        { text: "«بله… گاز می‌گرفتم تا صداشون دربیاد. اوج لذت همون موقع بود.»", correct: true, next: 4, feedback: "✅ پزشکی قانونی تطابق قطعی دندان را گزارش کرد." },
                        { text: "«نه، این یک اشتباه بود.»", correct: false, next: 4, feedback: "❌ با وجود تطابق DNA و دندان، انکار فایده ندارد." },
                        { text: "«اون پسر زنده مونده بود؟»", correct: false, next: 4, feedback: "❌ همه قربانیان کشته شدند." }
                    ]
                },
                {
                    text: "بازجو: ۵۳ قتل ثابت شده. حرف آخرت؟",
                    options: [
                        { text: "«من یک هیولا هستم. اما بدون من شما کارآگاها بیکار بودین.»", correct: true, next: -1, feedback: "✅ دقیقاً این جمله را در دادگاه گفت." },
                        { text: "«توبه می‌کنم.»", correct: false, next: -1, feedback: "❌ او هیچ‌وقت توبه نکرد." },
                        { text: "«بیگناهم.»", correct: false, next: -1, feedback: "❌ مدارک غیرقابل انکار است." }
                    ]
                }
            ]
        }
    };

    let currentKiller = 'samuel';
    let currentStage = 0;
    let totalScore = 0;
    let gameCompleted = false;
    let interrogationData = null;

    function loadEvidence(killerId) {
        const killer = killers[killerId];
        const container = document.getElementById('evidenceList');
        container.innerHTML = '';
        killer.evidence.forEach((ev, idx) => {
            const card = document.createElement('div');
            card.className = 'evidence-card';
            card.innerHTML = `<div><span class="evidence-icon">${ev.icon}</span> <strong>${ev.title}</strong></div><div class="evidence-detail" id="evDet-${idx}">${ev.desc}</div>`;
            card.addEventListener('click', () => {
                const det = document.getElementById(`evDet-${idx}`);
                det.style.display = (det.style.display === 'none' || !det.style.display) ? 'block' : 'none';
            });
            container.appendChild(card);
        });
    }

    function initInterrogation(killerId) {
        const killer = killers[killerId];
        interrogationData = JSON.parse(JSON.stringify(killer.interrogation));
        currentStage = 0;
        totalScore = 0;
        gameCompleted = false;
        document.getElementById('endingBox').style.display = 'none';
        document.getElementById('feedbackMsg').innerHTML = '';
        document.getElementById('narrativeBox').innerHTML = `📁 پرونده ${killer.name} (${killer.victims} قربانی). مدارک را بخوانید، سپس بازجویی را شروع کنید.`;
        document.getElementById('optionsArea').innerHTML = '';
    }

    function renderInterrogation() {
        if (gameCompleted) return;
        if (!interrogationData || currentStage >= interrogationData.length) {
            finalizeGame();
            return;
        }
        const stage = interrogationData[currentStage];
        document.getElementById('narrativeBox').innerHTML = `🔍 مرحله ${currentStage+1} از ${interrogationData.length}<br>${stage.text}`;
        const optionsDiv = document.getElementById('optionsArea');
        optionsDiv.innerHTML = '';
        stage.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.addEventListener('click', () => {
                if (opt.correct) {
                    totalScore += 20;
                    document.getElementById('feedbackMsg').innerHTML = opt.feedback + ` +۲۰ امتیاز`;
                } else {
                    document.getElementById('feedbackMsg').innerHTML = opt.feedback + ` امتیازی دریافت نشد.`;
                }
                if (opt.next === -1) {
                    gameCompleted = true;
                    finalizeGame();
                } else {
                    currentStage = opt.next !== undefined ? opt.next : currentStage + 1;
                    renderInterrogation();
                }
                saveGame();
            });
            optionsDiv.appendChild(btn);
        });
    }

    function finalizeGame() {
        let finalScore = totalScore;
        let message = '';
        if (finalScore >= 80) message = '🕵️‍♂️ کارآگاه نخبه! مدارک را دقیق خواندی و بازجویی عالی بود.';
        else if (finalScore >= 50) message = '📋 کارآگاه قابل قبول، اما برخی سرنخ‌ها را از دست دادی. دوباره مدارک را بررسی کن.';
        else message = '⚠️ امتیاز پایین. حتماً مدارک را ندیده‌ای. روی شواهد تمرکز کن.';
        document.getElementById('endingBox').innerHTML = `<h3>📄 پایان بازجویی</h3><p>امتیاز نهایی: ${finalScore} از ۱۰۰</p><p>${message}</p><button id="restartCaseBtn" style="background:#2c1a1a; border:1px solid #ab6743; padding:8px 16px; margin-top:12px;">🔄 بازجویی مجدد</button>`;
        document.getElementById('endingBox').style.display = 'block';
        document.getElementById('optionsArea').innerHTML = '';
        document.getElementById('restartCaseBtn')?.addEventListener('click', () => {
            initInterrogation(currentKiller);
            renderInterrogation();
        });
        saveGame();
    }

    function switchKiller(killerId) {
        currentKiller = killerId;
        loadEvidence(currentKiller);
        initInterrogation(currentKiller);
        renderInterrogation();
        document.querySelectorAll('.case-btn').forEach(btn => {
            if (btn.dataset.case === killerId) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        saveGame();
    }

    function saveGame() {
        const save = {
            killer: currentKiller,
            stage: currentStage,
            score: totalScore,
            completed: gameCompleted,
            notebook: document.getElementById('notebook').value
        };
        localStorage.setItem('SerialKillerGame', JSON.stringify(save));
    }

    function loadGame() {
        const raw = localStorage.getItem('SerialKillerGame');
        if (!raw) return false;
        try {
            const data = JSON.parse(raw);
            currentKiller = data.killer;
            currentStage = data.stage;
            totalScore = data.score;
            gameCompleted = data.completed;
            document.getElementById('notebook').value = data.notebook || '';
            return true;
        } catch(e) { return false; }
    }

    function resetGame() {
        switchKiller(currentKiller);
    }

    // رویدادها
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    document.getElementById('notebook').addEventListener('input', () => saveGame());
    document.querySelectorAll('.case-btn').forEach(btn => {
        btn.addEventListener('click', () => switchKiller(btn.dataset.case));
    });

    if (!loadGame()) {
        switchKiller('samuel');
    } else {
        loadEvidence(currentKiller);
        initInterrogation(currentKiller);
        renderInterrogation();
        document.querySelectorAll('.case-btn').forEach(btn => {
            if (btn.dataset.case === currentKiller) btn.classList.add('active');
        });
    }
</script>
</body>
</html>
