<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آخرین صلیب | The Last Cross</title>
    
    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface2: #222222;
            --border: #2a2a2a;
            --text: #c8c0b8;
            --text-light: #a09890;
            --accent: #8b0000;
            --accent-glow: #b01010;
            --gold: #c8a850;
            --font-main: 'Vazirmatn', 'Crimson Text', serif;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        /* تم روشن */
        .theme-light {
            --bg: #f5f0eb;
            --surface: #ffffff;
            --surface2: #f0ebe3;
            --border: #d4c5b5;
            --text: #3a2a1a;
            --text-light: #6b5040;
            --accent: #8b0000;
            --accent-glow: #b01010;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 50% 0%, rgba(139,0,0,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(139,0,0,0.04) 0%, transparent 50%);
            transition: background 0.5s, color 0.5s;
        }
        
        /* نویز متحرک */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.015;
            pointer-events: none;
            z-index: 0;
            animation: grain 0.5s steps(5) infinite;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        
        @keyframes grain {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-1%, -1%); }
            40% { transform: translate(1%, 1%); }
            60% { transform: translate(-1%, 1%); }
            80% { transform: translate(1%, -1%); }
        }
        
        .app-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
        }
        
        /* نوار بالایی */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 5px;
        }
        
        .theme-toggle {
            display: flex;
            gap: 6px;
        }
        
        .theme-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }
        
        .theme-dot.dark {
            background: #1a1a1a;
            border-color: #444;
        }
        
        .theme-dot.light {
            background: #f5f0eb;
            border-color: #d4c5b5;
        }
        
        .theme-dot.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(139,0,0,0.4);
        }
        
        .badge {
            background: rgba(139,0,0,0.12);
            border: 1px solid rgba(139,0,0,0.25);
            padding: 6px 14px;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
            border-radius: 2px;
        }
        
        /* کارت اصلی */
        .game-container {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px 45px;
            border-radius: 4px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                0 0 80px rgba(139,0,0,0.06),
                inset 0 1px 0 rgba(255,255,255,0.02);
            position: relative;
            overflow: hidden;
            transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,0,0,0.25), transparent);
        }
        
        /* هدر */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .game-title {
            font-family: 'Crimson Text', serif;
            color: var(--accent);
            font-size: 22px;
            letter-spacing: 6px;
            font-weight: 400;
            text-shadow: 0 0 25px rgba(139,0,0,0.25);
        }
        
        .status-pills {
            display: flex;
            gap: 12px;
        }
        
        .status-pill {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-light);
            opacity: 0.4;
        }
        
        .status-dot.live {
            background: var(--accent);
            opacity: 1;
            box-shadow: 0 0 6px var(--accent);
            animation: pulse-dot 2s infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* لوکیشن */
        .location {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 25px;
            opacity: 0.85;
        }
        
        .location-icon {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        
        /* متن اصلی */
        .scene-text {
            font-size: 16px;
            line-height: 2.3;
            color: var(--text);
            margin-bottom: 25px;
            animation: fadeUp 0.5s ease;
        }
        
        /* باکس دیالوگ */
        .dialogue-box {
            padding: 18px 22px;
            margin-bottom: 30px;
            border-right: 3px solid var(--accent);
            background: linear-gradient(90deg, rgba(139,0,0,0.05) 0%, transparent 100%);
            font-style: italic;
            color: var(--text-light);
            line-height: 2.2;
            border-radius: 0 3px 3px 0;
            animation: fadeUp 0.7s ease;
            position: relative;
        }
        
        .dialogue-box::before {
            content: '❝';
            position: absolute;
            top: -6px;
            right: 14px;
            font-size: 18px;
            color: rgba(139,0,0,0.25);
            font-style: normal;
        }
        
        /* دکمه‌های انتخاب */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .choice-btn {
            width: 100%;
            text-align: right;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 15px 20px;
            font-family: var(--font-main);
            font-size: 15px;
            cursor: pointer;
            transition: all var(--transition);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        
        .choice-btn::before {
            content: '';
            position: absolute;
            right: 0; top: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(139,0,0,0.12), transparent);
            transition: width 0.4s ease;
        }
        
        .choice-btn:hover {
            border-color: var(--accent);
            color: #ffffff;
            transform: translateX(-4px);
            box-shadow: 0 6px 20px rgba(139,0,0,0.12);
        }
        
        .choice-btn:hover::before {
            width: 100%;
        }
        
        .choice-btn:active {
            transform: scale(0.985);
            transition: 0.08s;
        }
        
        /* فوتر */
        .game-footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-light);
            opacity: 0.5;
        }
        
        /* انیمیشن */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* رسپانسیو */
        @media (max-width: 600px) {
            .game-container {
                padding: 25px 20px;
            }
            .game-title {
                font-size: 18px;
                letter-spacing: 3px;
            }
            .scene-text {
                font-size: 14px;
            }
            .choice-btn {
                font-size: 13px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- نوار بالا -->
        <div class="top-bar">
            <span class="badge">پروندهٔ فعال</span>
            <div class="theme-toggle">
                <span class="theme-dot dark active" onclick="setTheme('dark')" title="تم تاریک"></span>
                <span class="theme-dot light" onclick="setTheme('light')" title="تم روشن"></span>
            </div>
        </div>
        
        <!-- کارت بازی -->
        <div class="game-container">
            <div class="game-header">
                <div class="game-title">آخرین صلیب</div>
                <div class="status-pills">
                    <span class="status-pill"><span class="status-dot live"></span> <span id="clueCount">سرنخ: ۰</span></span>
                    <span class="status-pill"><span class="status-dot"></span> <span id="timeDisplay">روز: ۱</span></span>
                </div>
            </div>
            
            <div class="location">
                <span class="location-icon"></span>
                <span id="location"></span>
            </div>
            
            <div class="scene-text" id="sceneText"></div>
            <div class="dialogue-box" id="dialogue" style="display:none;"></div>
            <div class="choices" id="choices"></div>
            
            <div class="game-footer">
                <span>نورثبروک، اورگن</span>
                <span id="stressMeter"></span>
            </div>
        </div>
    </div>
    
    <script>
        function setTheme(theme) {
            document.body.className = theme === 'light' ? 'theme-light' : '';
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
            document.querySelector('.theme-dot.' + theme).classList.add('active');
        }
    </script>
    
    <!-- ⬇⬇⬇ فایل داستان ⬇⬇⬇ -->
    <script src="story.js"></script>
</body>
</html>
