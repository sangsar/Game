        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh; min-height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            padding: 12px; transition: background var(--transition-speed), color var(--transition-speed);
            position: relative; overflow-x: hidden; line-height: 1.6;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        .crt-scanlines { display: var(--scanlines); position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px); animation: scanMove 0.3s linear infinite; }
        @keyframes scanMove { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }
        .crt-curve { display: var(--scanlines); position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 99; border-radius: var(--screen-curve); box-shadow: inset 0 0 80px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.3); }
        .paper-lines { display: var(--paper-lines); position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; background-image: repeating-linear-gradient(transparent, transparent 31px, #d4c5a0 31px, #d4c5a0 32px); background-size: 100% 32px; }
        .paper-red-line { display: var(--paper-lines); position: absolute; top: 0; left: 50px; width: 2px; height: 100%; pointer-events: none; z-index: 0; background: rgba(255,0,0,0.15); }

        #bloodCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; display: var(--blood-drips); }

        .crt-frame { display: none; position: relative; background: #1a1a0a; border: 10px solid #111; border-radius: 18px; padding: 18px; box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 20px 50px rgba(0,0,0,0.8); }
        body.theme-crt .crt-frame { display: block; }

        .app-wrapper { position: relative; z-index: 2; width: 100%; max-width: 800px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 5px; }
        .mini-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text-light); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .mini-btn:active { transform: scale(0.92); }
        .mini-btn.playing { border-color: var(--accent); animation: musicPulse 1.5s infinite; }
        @keyframes musicPulse { 0%,100%{box-shadow:0 0 5px var(--accent-glow)}50%{box-shadow:0 0 20px var(--accent-glow)} }

        .game-container { width: 100%; background: var(--card-bg); border: 1px solid var(--card-border); padding: 28px 24px; border-radius: 6px; box-shadow: var(--card-shadow); min-height: 480px; max-height: 82vh; max-height: 82dvh; overflow-y: auto; transition: all var(--transition-speed); scroll-behavior: smooth; position: relative; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--accent) var(--surface); }
        .game-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); z-index: 5; }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--header-border); position: sticky; top: 0; background: var(--surface); z-index: 5; padding-top: 4px; }
        .game-title { font-family: var(--font-cinema); color: var(--accent); font-size: clamp(18px, 5vw, 24px); letter-spacing: 4px; text-shadow: 0 0 15px var(--accent-glow); }
        .status-pills { display: flex; gap: 12px; font-size: 9px; letter-spacing: 2px; color: var(--text-light); font-family: var(--font-mono); white-space: nowrap; }

        .location { font-family: var(--font-cinema); font-size: var(--location-size); letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; opacity: 0.9; font-weight: 600; text-shadow: 0 0 10px var(--accent-glow); animation: fadeInUp 0.4s ease; }
        .scene-text { font-size: clamp(14px, 3.8vw, 16px); line-height: 2.5; color: var(--text); margin-bottom: 22px; font-family: var(--font-serif); animation: fadeInUp 0.5s ease; }
        .dialogue-box { padding: 16px 20px; margin-bottom: 24px; border-right: 3px solid var(--accent); background: linear-gradient(90deg, var(--dialogue-bg) 0%, transparent 100%); font-style: italic; color: var(--text-light); line-height: 2.3; border-radius: 0 4px 4px 0; font-family: var(--font-serif); animation: fadeInUp 0.6s ease; word-break: break-word; }

        .choices { display: flex; flex-direction: column; gap: 10px; position: sticky; bottom: 0; background: var(--surface); padding-top: 14px; border-top: 1px solid var(--border); z-index: 5; }
        .choice-btn { width: 100%; text-align: right; background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--btn-border); padding: 16px 20px; font-family: var(--font-main); font-size: clamp(13px, 3.5vw, 15px); cursor: pointer; transition: all 0.25s; border-radius: 4px; letter-spacing: 0.4px; position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-height: 50px; display: flex; align-items: center; }
        .choice-btn::before { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
        .choice-btn:active { transform: scale(0.97); }
        .choice-btn:hover { border-color: var(--btn-hover-border); color: #fff; box-shadow: var(--btn-hover-shadow); }
        .choice-btn:hover::before { opacity: 1; }

        .game-footer { margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 9px; letter-spacing: 2px; color: var(--text-light); opacity: 0.5; font-family: var(--font-mono); text-align: center; }

        .tutorial-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 200; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .tutorial-box { background: var(--surface); border: 1px solid var(--border); padding: 32px 24px; max-width: 500px; width: 100%; border-radius: 6px; text-align: center; font-family: var(--font-main); }
        .tutorial-box h2 { font-family: var(--font-cinema); color: var(--accent); letter-spacing: 5px; margin-bottom: 22px; font-size: clamp(20px, 6vw, 26px); }
        .tutorial-box p { line-height: 2.2; margin-bottom: 12px; color: var(--text-light); font-size: clamp(13px, 3.5vw, 15px); }
        .tutorial-box .start-btn { background: var(--accent); color: #fff; border: none; padding: 14px 36px; font-family: var(--font-cinema); font-size: clamp(14px, 4vw, 16px); cursor: pointer; letter-spacing: 3px; margin-top: 18px; transition: all 0.3s; border-radius: 4px; min-height: 50px; }
        .tutorial-box .start-btn:active { transform: scale(0.95); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bloodDrip { 0% { transform: translateY(-10px); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.3; } 100% { transform: translateY(105vh); opacity: 0; } }
        @keyframes weaponFloat { 0%, 100% { transform: rotate(-3deg) translateY(0); } 25% { transform: rotate(6deg) translateY(-14px); } 50% { transform: rotate(-4deg) translateY(-6px); } 75% { transform: rotate(5deg) translateY(-18px); } }
        @keyframes mistDrift { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } }

        .weapon-real { position: fixed; pointer-events: none; z-index: 0; opacity: var(--weapon-opacity); filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)); animation: weaponFloat 12s ease-in-out infinite; }
        .weapon-real.axe1 { top: 6%; left: 4%; width: 70px; height: 70px; }
        .weapon-real.axe2 { top: 72%; right: 3%; width: 55px; height: 55px; animation-delay: -4s; }
        .weapon-real.gun1 { bottom: 12%; left: 10%; width: 80px; height: 50px; animation-delay: -7s; }
        .weapon-real.gun2 { top: 38%; right: 6%; width: 65px; height: 40px; animation-delay: -2s; }
        .weapon-real.knife1 { top: 28%; left: 85%; width: 40px; height: 60px; animation-delay: -9s; }

        .mist-overlay { position: fixed; pointer-events: none; z-index: 1; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 50%, rgba(100,80,60,0.04) 0%, transparent 70%); animation: mistDrift 15s ease-in-out infinite; }

        @media (max-width: 600px) {
            body { padding: 8px; align-items: flex-start; padding-top: 20px; }
            .game-container { padding: 20px 16px; max-height: 88vh; max-height: 88dvh; border-radius: 4px; }
            .game-header { margin-bottom: 16px; padding-bottom: 12px; }
            .location { margin-bottom: 16px; }
            .scene-text { margin-bottom: 16px; }
            .dialogue-box { margin-bottom: 18px; padding: 14px 16px; }
            .choice-btn { padding: 14px 16px; min-height: 48px; }
            .choices { gap: 8px; padding-top: 10px; }
            .top-bar { margin-bottom: 6px; }
            .mini-btn { width: 34px; height: 34px; font-size: 14px; }
        }
    </style>
</head>

    <div class="crt-frame" id="crtFrame"><div class="app-wrapper"></div></div>

    <div class="weapon-real axe2"><svg viewBox="0 0 100 100"><rect x="36" y="6" width="7" height="84" rx="2" fill="#3a1a0a"/><path d="M18 12 L58 2 L62 28 L22 38 Z" fill="url(#metalGrad2)"/><defs><linearGradient id="metalGrad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#aaa"/><stop offset="100%" stop-color="#444"/></linearGradient></defs></svg></div>
    <div class="weapon-real gun1"><svg viewBox="0 0 120 80"><rect x="8" y="24" width="92" height="16" rx="3" fill="#444"/><rect x="100" y="18" width="14" height="8" rx="2" fill="#333"/><rect x="14" y="40" width="22" height="10" rx="2" fill="#2a1a0a"/><circle cx="12" cy="32" r="4" fill="#222"/></svg></div>
    <div class="weapon-real gun2"><svg viewBox="0 0 100 70"><rect x="5" y="18" width="82" height="14" rx="3" fill="#555"/><rect x="87" y="16" width="11" height="6" rx="2" fill="#333"/></svg></div>
    <div class="weapon-real knife1"><svg viewBox="0 0 50 80"><rect x="22" y="5" width="6" height="38" rx="2" fill="#3a2a1a"/><path d="M14 43 L36 43 L30 72 L20 72 Z" fill="url(#knifeGrad)"/><defs><linearGradient id="knifeGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ccc"/><stop offset="100%" stop-color="#555"/></linearGradient></defs></svg></div>

    <div class="mist-overlay"></div>
    <canvas id="bloodCanvas"></canvas>

    <audio id="bgMusic1" src="https://dl.just-music.ir/music//Soundtrack/Dark/Dark%20Cycle%201%20(2019)/320/11.%20Gott%20Gib%20Mir%20Gelassenheit.mp3" preload="auto"></audio>
    <audio id="bgMusic2" src="https://dl.just-music.ir/music//Soundtrack/Dark/Dark%20Cycle%202%20(2019)/320/01.%20Schwarze%20Materie.mp3" preload="auto"></audio>

    <div class="app-wrapper" id="mainWrapper">
        <div class="top-bar">
            <button class="mini-btn" id="musicBtn" onclick="toggleMusic()" aria-label="موسیقی">🎵</button>
            <button class="mini-btn" id="themeBtn" onclick="cycleTheme()" aria-label="تغییر تم">🎨</button>
        </div>

        <main class="game-container" id="gameContainer">
            <div class="paper-lines"></div>
            <div class="paper-red-line"></div>
            <header class="game-header">
                <h1 class="game-title">آخرین صلیب</h1>
                <div class="status-pills"><span id="clueCount">سرنخ: ۰</span><span id="timeDisplay">روز: ۱</span></div>
            </header>
            <div class="location" id="location"></div>
            <div class="scene-text" id="sceneText"></div>
            <div class="dialogue-box" id="dialogue"></div>
            <nav class="choices" id="choices"></nav>
            <footer class="game-footer">نورثبروک، اورگن</footer>
        </main>
    </div>

    <div class="tutorial-overlay" id="tutorial">
        <div class="tutorial-box">
            <h2>✞ آخرین صلیب ✞</h2>
            <p>نورثبروک، اورگن. شهر کوچیکی که همه همدیگه رو می‌شناسن.</p>
            <p>تو کارآگاه جیمی مورو هستی. قاتل سریالی رو پیدا کن.</p>
            <p>هر انتخاب تو عواقبی داره.</p>
            <p style="color:var(--accent);">بارون نمی‌ایسته. قاتل هنوز آزاده.</p>
            <button class="start-btn" onclick="startGame()">شروع پرونده</button>
        </div>
    </div>

    <script>
        const themes = ['theme-classic','theme-crt','theme-newspaper','theme-notebook','theme-interrogation','theme-morgue','theme-slaughterhouse','theme-neonoir'];
        let currentTheme = 0;

        function cycleTheme() {
            currentTheme = (currentTheme + 1) % themes.length;
            document.body.className = themes[currentTheme];
            localStorage.setItem('lastCrossTheme', themes[currentTheme]);
            const crtFrame = document.getElementById('crtFrame');
            const mainWrapper = document.getElementById('mainWrapper');
            if (themes[currentTheme] === 'theme-crt') {
                if (!crtFrame.contains(mainWrapper)) crtFrame.querySelector('.app-wrapper').appendChild(mainWrapper);
            } else {
                if (crtFrame.contains(mainWrapper)) document.body.insertBefore(mainWrapper, crtFrame);
            }
        }

        const bgMusic1 = document.getElementById('bgMusic1');
        const bgMusic2 = document.getElementById('bgMusic2');
        const musicBtn = document.getElementById('musicBtn');
        let musicPlaying = false, currentTrack = 1;
        bgMusic1.addEventListener('ended', () => { currentTrack = 2; bgMusic2.play().catch(()=>{}); });
        bgMusic2.addEventListener('ended', () => { currentTrack = 1; bgMusic1.play().catch(()=>{}); });

        function toggleMusic() {
            if (musicPlaying) { bgMusic1.pause(); bgMusic2.pause(); musicBtn.classList.remove('playing'); musicBtn.innerHTML='🔇'; }
            else { (currentTrack===1?bgMusic1:bgMusic2).play().catch(()=>{}); musicBtn.classList.add('playing'); musicBtn.innerHTML='🎵'; }
            musicPlaying = !musicPlaying; localStorage.setItem('lastCrossMusic', musicPlaying);
        }
        document.addEventListener('click', function initAudio() {
            if (!musicPlaying) { bgMusic1.play().then(()=>{ musicPlaying=true; musicBtn.classList.add('playing'); musicBtn.innerHTML='🎵'; }).catch(()=>{}); }
        }, {once:true});

        const canvas = document.getElementById('bloodCanvas'), ctx = canvas.getContext('2d');
        let drops = [];
        function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        for (let i=0;i<35;i++) drops.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height*0.4, speed:0.15+Math.random()*1.4, size:1+Math.random()*5, opacity:0.08+Math.random()*0.5});
        function drawBlood() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for (let d of drops) { d.y+=d.speed; if(d.y>canvas.height+15){d.y=-15;d.x=Math.random()*canvas.width;}
                ctx.beginPath(); ctx.ellipse(d.x,d.y,d.size,d.size*4,0,0,Math.PI*2); ctx.fillStyle=`rgba(110,0,0,${d.opacity})`; ctx.fill(); }
            requestAnimationFrame(drawBlood);
        }
        drawBlood();

        function startGame() { document.getElementById('tutorial').style.display='none'; if(typeof loadScene==='function') loadScene('scene0_flashback'); }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('lastCrossTheme');
            if (savedTheme && themes.includes(savedTheme)) { document.body.className = savedTheme; currentTheme = themes.indexOf(savedTheme); }
            const savedMusic = localStorage.getItem('lastCrossMusic');
            if (savedMusic==='true') { bgMusic1.play().then(()=>{ musicPlaying=true; musicBtn.classList.add('playing'); musicBtn.innerHTML='🎵'; }).catch(()=>{}); }
            if (savedTheme === 'theme-crt') {
                const crt=document.getElementById('crtFrame'); const mw=document.getElementById('mainWrapper');
                if(!crt.contains(mw)) crt.querySelector('.app-wrapper').appendChild(mw);
            }
        });
    </script>
    <script src="story.js"></script>
