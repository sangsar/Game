<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>آخرین صلیب | The Last Cross</title>
    <meta name="description" content="در شهر بارانی نورثبروک، قاتلی سریالی با طناب قربانیانش را خفه می‌کند. کارآگاه جیمی مورو باش و در این داستان تعاملی جنایی، قاتل را پیدا کن.">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/lalezar@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim@v4.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/tanha@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/parastoo@v1.0.0/dist/font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IM+Fell+English+SC&family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Walter+Turncoat&family=Creepster&display=swap" rel="stylesheet">

    <style>
        /* ========== متغیرهای پایه (تم پیش‌فرض: جنایی کلاسیک) ========== */
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface2: #222;
            --border: #333;
            --text: #c8c0b8;
            --text-light: #a09890;
            --accent: #8b3a3a;
            --accent-glow: #a04040;
            --font-main: 'Vazirmatn', sans-serif;
            --font-serif: 'Crimson Text', serif;
            --font-mono: 'Special Elite', monospace;
            --font-cinema: 'Playfair Display', serif;
            --location-size: 15px;
            --card-bg: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
            --card-border: #333;
            --card-shadow: 0 20px 60px rgba(0,0,0,0.6);
            --btn-bg: linear-gradient(135deg, #2a1a0a, #1a0a0a);
            --btn-border: #5a3a2a;
            --btn-text: #d0c0a0;
            --btn-hover-border: #8b0000;
            --btn-hover-shadow: 0 6px 20px rgba(139,0,0,0.3);
            --dialogue-bg: rgba(139,58,58,0.06);
            --header-border: #333;
            --crt-scanlines: none;
            --crt-flicker: none;
            --btn-keyboard: false;
        }

        /* ========== ۱. تم کلاسیک جنایی ========== */
        body.theme-classic {
            --bg: #0d0d0d; --surface: #1a1a1a; --surface2: #222; --border: #333;
            --text: #c8c0b8; --text-light: #a09890; --accent: #8b3a3a; --accent-glow: #a04040;
            --font-main: 'Vazirmatn', sans-serif; --font-serif: 'Crimson Text', serif;
            --font-mono: 'Special Elite', monospace; --font-cinema: 'Playfair Display', serif;
            --location-size: 15px; --card-bg: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
            --card-border: #333; --card-shadow: 0 20px 60px rgba(0,0,0,0.6);
            --btn-bg: linear-gradient(135deg, #2a1a0a, #1a0a0a); --btn-border: #5a3a2a;
            --btn-text: #d0c0a0; --btn-hover-border: #8b0000; --btn-hover-shadow: 0 6px 20px rgba(139,0,0,0.3);
            --dialogue-bg: rgba(139,58,58,0.06); --header-border: #333;
            --crt-scanlines: none; --crt-flicker: none; --btn-keyboard: false;
        }

        /* ========== ۲. ترمینال آنالوگ (فقط باکس بازی) ========== */
        body.theme-crt {
            --bg: #111;
            --surface: #000;
            --surface2: #000;
            --border: #1a1a1a;
            --text: #33ff33;
            --text-light: #22cc22;
            --accent: #00ff00;
            --accent-glow: #00ff00;
            --font-main: 'VT323', monospace; 
            --font-serif: 'VT323', monospace;
            --font-mono: 'VT323', monospace;
            --font-cinema: 'VT323', monospace;
            --location-size: 18px;
            --card-bg: #0a0f0a;
            --card-border: #1a3a1a;
            --card-shadow: 0 0 20px rgba(0,255,0,0.2), inset 0 0 60px rgba(0,0,0,0.5);
            --btn-bg: #0a1a0a;
            --btn-border: #33ff33;
            --btn-text: #33ff33;
            --btn-hover-border: #00ff00;
            --btn-hover-shadow: 0 0 15px rgba(0,255,0,0.6);
            --dialogue-bg: rgba(0,255,0,0.05);
            --header-border: #1a3a1a;
            --crt-scanlines: block;
            --crt-flicker: block;
            --btn-keyboard: true;
        }

        /* ========== ۳. روزنامهٔ قدیمی ========== */
        body.theme-newspaper {
            --bg: #d4c5a0; --surface: #e8dcc0; --surface2: #ddd0b0; --border: #c4b590;
            --text: #2a1a0a; --text-light: #5a4a3a; --accent: #8b1a1a; --accent-glow: #a02020;
            --font-main: 'Parastoo', serif; --font-serif: 'Crimson Text', serif;
            --font-mono: 'IM Fell English SC', serif; --font-cinema: 'Playfair Display', serif;
            --location-size: 18px; --card-bg: #e8dcc0; --card-border: #c4b590;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.2);
            --btn-bg: #ddd0b0; --btn-border: #b4a580; --btn-text: #3a2a1a;
            --btn-hover-border: #8b1a1a; --btn-hover-shadow: 0 4px 12px rgba(139,26,26,0.3);
            --dialogue-bg: rgba(0,0,0,0.03); --header-border: #c4b590;
            --crt-scanlines: none; --crt-flicker: none; --btn-keyboard: false;
        }

        /* ========== ۴. سردخانه (مشرح پزشکی قانونی) ========== */
        body.theme-morgue {
            --bg: #d0d5da; --surface: #ffffff; --surface2: #f0f4f8; --border: #c0c8d0;
            --text: #2a3a4a; --text-light: #5a6a7a; --accent: #3a6a8a; --accent-glow: #4a7a9a;
            --font-main: 'Nahid', sans-serif; --font-serif: 'Crimson Text', serif;
            --font-mono: 'Courier Prime', monospace; --font-cinema: 'Playfair Display', serif;
            --location-size: 15px; --card-bg: #ffffff; --card-border: #c0c8d0;
            --card-shadow: 0 10px 40px rgba(0,0,0,0.1);
            --btn-bg: #f0f4f8; --btn-border: #a0b0c0; --btn-text: #2a3a4a;
            --btn-hover-border: #3a6a8a; --btn-hover-shadow: 0 4px 15px rgba(58,106,138,0.2);
            --dialogue-bg: rgba(0,0,0,0.02); --header-border: #c0c8d0;
            --crt-scanlines: none; --crt-flicker: none; --btn-keyboard: false;
        }

        /* ========== استایل کلی ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; overflow: hidden; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            height: 100vh; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            padding: 12px; transition: background 0.6s, color 0.6s;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; line-height: 1.6;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        /* اسکن‌لاین مختص باکس بازی در تم CRT */
        .game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            display: var(--crt-scanlines);
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
            animation: scanMove 0.3s linear infinite;
        }
        @keyframes scanMove { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }

        .app-wrapper { position: relative; z-index: 2; width: 100%; max-width: 800px; height: 100%; display: flex; flex-direction: column; }
        .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 5px; flex-shrink: 0; }
        .mini-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--surface2); border: 1px solid var(--border);
            color: var(--text-light); cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .mini-btn:active { transform: scale(0.92); }
        .mini-btn.playing { border-color: var(--accent); animation: musicPulse 1.5s infinite; }
        @keyframes musicPulse { 0%,100%{box-shadow:0 0 5px var(--accent-glow)}50%{box-shadow:0 0 20px var(--accent-glow)} }

        .game-container {
            flex: 1; width: 100%; background: var(--card-bg);
            border: 1px solid var(--card-border); padding: 24px 20px; border-radius: 6px;
            box-shadow: var(--card-shadow); overflow-y: auto; transition: all 0.5s;
            scroll-behavior: smooth; position: relative;
            -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--accent) var(--surface);
        }
        .game-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent); z-index: 5;
        }

        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--header-border);
            position: sticky; top: 0; background: var(--surface); z-index: 5; padding-top: 4px;
        }
        .game-title {
            font-family: var(--font-cinema); color: var(--accent);
            font-size: clamp(18px, 5vw, 24px); letter-spacing: 4px;
            text-shadow: 0 0 15px var(--accent-glow);
        }
        .status-pills { display: flex; gap: 12px; font-size: 9px; letter-spacing: 2px; color: var(--text-light); font-family: var(--font-mono); white-space: nowrap; }

        .location {
            font-family: var(--font-cinema); font-size: var(--location-size);
            letter-spacing: 4px; text-transform: uppercase; color: var(--accent);
            margin-bottom: 20px; opacity: 0.9; font-weight: 600;
            text-shadow: 0 0 10px var(--accent-glow); animation: fadeInUp 0.4s ease;
        }
        .scene-text { font-size: clamp(14px, 3.8vw, 16px); line-height: 2.5; color: var(--text); margin-bottom: 20px; font-family: var(--font-serif); animation: fadeInUp 0.5s ease; }
        .dialogue-box {
            padding: 14px 18px; margin-bottom: 22px; border-right: 3px solid var(--accent);
            background: linear-gradient(90deg, var(--dialogue-bg) 0%, transparent 100%);
            font-style: italic; color: var(--text-light); line-height: 2.3;
            border-radius: 0 4px 4px 0; font-family: var(--font-serif); animation: fadeInUp 0.6s ease; word-break: break-word;
        }

        .choices {
            display: flex; flex-direction: column; gap: 10px; position: sticky; bottom: 0;
            background: var(--surface); padding-top: 14px; border-top: 1px solid var(--border); z-index: 5;
        }
        .choice-btn {
            width: 100%; text-align: right; background: var(--btn-bg); color: var(--btn-text);
            border: 1px solid var(--btn-border); padding: 14px 18px;
            font-family: var(--font-main); font-size: clamp(13px, 3.5vw, 15px);
            cursor: pointer; transition: all 0.25s; border-radius: 4px; letter-spacing: 0.4px;
            position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; min-height: 48px; display: flex; align-items: center;
        }
        .choice-btn::before { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
        .choice-btn:active { transform: scale(0.97); }
        .choice-btn:hover { border-color: var(--btn-hover-border); color: #fff; box-shadow: var(--btn-hover-shadow); }
        .choice-btn:hover::before { opacity: 1; }

        /* دکمه‌های کیبوردی برای تم CRT */
        body.theme-crt .choice-btn {
            border-radius: 2px; background: #111; border: 1px solid #33ff33;
            box-shadow: 2px 2px 0 #0a0a0a, inset -1px -1px 0 #000;
            font-family: 'VT323', monospace; letter-spacing: 1px;
            text-transform: uppercase;
        }
        body.theme-crt .choice-btn:active { transform: translate(1px, 1px); box-shadow: none; }

        .game-footer { margin-top: 20px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 9px; letter-spacing: 2px; color: var(--text-light); opacity: 0.5; font-family: var(--font-mono); text-align: center; }

        .tutorial-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 200; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .tutorial-box { background: var(--surface); border: 1px solid var(--border); padding: 30px 22px; max-width: 500px; width: 100%; border-radius: 6px; text-align: center; font-family: var(--font-main); }
        .tutorial-box h2 { font-family: var(--font-cinema); color: var(--accent); letter-spacing: 5px; margin-bottom: 20px; font-size: clamp(20px, 6vw, 26px); }
        .tutorial-box p { line-height: 2.2; margin-bottom: 10px; color: var(--text-light); font-size: clamp(13px, 3.5vw, 15px); }
        .tutorial-box .start-btn { background: var(--accent); color: #fff; border: none; padding: 14px 36px; font-family: var(--font-cinema); font-size: clamp(14px, 4vw, 16px); cursor: pointer; letter-spacing: 3px; margin-top: 16px; transition: all 0.3s; border-radius: 4px; min-height: 48px; }
        .tutorial-box .start-btn:active { transform: scale(0.95); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .game-container { padding: 16px 14px; border-radius: 4px; }
            .game-header { margin-bottom: 14px; padding-bottom: 10px; }
            .location { margin-bottom: 14px; }
            .scene-text { margin-bottom: 14px; }
            .dialogue-box { margin-bottom: 16px; padding: 12px 14px; }
            .choice-btn { padding: 12px 14px; min-height: 44px; }
            .choices { gap: 8px; padding-top: 8px; }
            .top-bar { margin-bottom: 6px; }
            .mini-btn { width: 34px; height: 34px; font-size: 14px; }
        }
    </style>
</head>
<body class="theme-classic">

    <div class="app-wrapper" id="mainWrapper">
        <div class="top-bar">
            <button class="mini-btn" id="musicBtn" onclick="toggleMusic()" aria-label="موسیقی">🎵</button>
            <button class="mini-btn" id="themeBtn" onclick="cycleTheme()" aria-label="تغییر تم">🎨</button>
        </div>

        <main class="game-container" id="gameContainer">
            <header class="game-header">
                <h1 class="game-title">آخرین صلیب</h1>
                <div class="status-pills"><span id="clueCount">سرنخ: ۰</span><span id="timeDisplay">روز: ۱</span></div>
            </header>
            <div class="location" id="location"></div>
            <div class="scene-text" id="sceneText"></div>
            <div class="dialogue-box" id="dialogue"></div>
            <nav class="choices" id="choices"></nav>
            <footer class="game-footer">نورثبروک، اورگن</footer>
        </main>
    </div>

    <div class="tutorial-overlay" id="tutorial">
        <div class="tutorial-box">
            <h2>✞ آخرین صلیب ✞</h2>
            <p>نورثبروک، اورگن. شهر کوچیکی که همه همدیگه رو می‌شناسن.</p>
            <p>تو کارآگاه جیمی مورو هستی. قاتل سریالی رو پیدا کن.</p>
            <p>هر انتخاب تو عواقبی داره.</p>
            <p style="color:var(--accent);">بارون نمی‌ایسته. قاتل هنوز آزاده.</p>
            <button class="start-btn" onclick="startGame()">شروع پرونده</button>
        </div>
    </div>

    <audio id="bgMusic1" src="https://dl.just-music.ir/music//Soundtrack/Dark/Dark%20Cycle%201%20(2019)/320/11.%20Gott%20Gib%20Mir%20Gelassenheit.mp3" preload="auto"></audio>
    <audio id="bgMusic2" src="https://dl.just-music.ir/music//Soundtrack/Dark/Dark%20Cycle%202%20(2019)/320/01.%20Schwarze%20Materie.mp3" preload="auto"></audio>

    <script>
        const themes = ['theme-classic', 'theme-crt', 'theme-newspaper', 'theme-morgue'];
        const themeNames = ['جنایی کلاسیک', 'ترمینال آنالوگ', 'روزنامه قدیمی', 'سردخانه'];
        let currentTheme = 0;

        function cycleTheme() {
            currentTheme = (currentTheme + 1) % themes.length;
            document.body.className = themes[currentTheme];
            localStorage.setItem('lastCrossTheme', themes[currentTheme]);
            showThemeToast(themeNames[currentTheme]);
        }

        function showThemeToast(name) {
            let toast = document.getElementById('themeToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'themeToast';
                toast.style.cssText = `
                    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
                    background: var(--surface2); color: var(--accent); padding: 8px 20px;
                    border-radius: 20px; font-family: var(--font-main); font-size: 12px;
                    z-index: 300; pointer-events: none; transition: all 0.4s;
                    border: 1px solid var(--accent); opacity: 0;
                `;
                document.body.appendChild(toast);
            }
            toast.textContent = `🎨 ${name}`;
            toast.style.opacity = '1';
            toast.style.top = '30px';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.opacity = '0'; toast.style.top = '20px'; }, 1500);
        }

        const bgMusic1 = document.getElementById('bgMusic1');
        const bgMusic2 = document.getElementById('bgMusic2');
        const musicBtn = document.getElementById('musicBtn');
        let musicPlaying = false, currentTrack = 1;

        bgMusic1.addEventListener('ended', () => { currentTrack = 2; bgMusic2.play().catch(()=>{}); });
        bgMusic2.addEventListener('ended', () => { currentTrack = 1; bgMusic1.play().catch(()=>{}); });

        function toggleMusic() {
            if (musicPlaying) {
                bgMusic1.pause(); bgMusic2.pause();
                musicBtn.classList.remove('playing'); musicBtn.innerHTML='🔇';
            } else {
                (currentTrack===1?bgMusic1:bgMusic2).play().catch(()=>{});
                musicBtn.classList.add('playing'); musicBtn.innerHTML='🎵';
            }
            musicPlaying = !musicPlaying;
            localStorage.setItem('lastCrossMusic', musicPlaying);
        }

        document.addEventListener('click', function initAudio() {
            if (!musicPlaying) {
                bgMusic1.play().then(()=>{ musicPlaying=true; musicBtn.classList.add('playing'); musicBtn.innerHTML='🎵'; }).catch(()=>{});
            }
        }, {once:true});

        function startGame() {
            document.getElementById('tutorial').style.display='none';
            if(typeof loadScene==='function') loadScene('scene0_flashback');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('lastCrossTheme');
            if (savedTheme && themes.includes(savedTheme)) {
                document.body.className = savedTheme;
                currentTheme = themes.indexOf(savedTheme);
            }
            const savedMusic = localStorage.getItem('lastCrossMusic');
            if (savedMusic==='true') {
                bgMusic1.play().then(()=>{ musicPlaying=true; musicBtn.classList.add('playing'); musicBtn.innerHTML='🎵'; }).catch(()=>{});
            }
        });
    </script>
    <script src="story.js"></script>
</body>
</html>
