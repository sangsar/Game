<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آخرین صلیب | The Last Cross</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface2: #222222;
            --border: #2a2a2a;
            --text: #c8c0b8;
            --text-light: #a09890;
            --accent: #8b0000;
            --font-main: 'Vazirmatn', 'Crimson Text', serif;
        }
        
        .theme-light {
            --bg: #f5f0eb;
            --surface: #ffffff;
            --surface2: #f0ebe3;
            --border: #d4c5b5;
            --text: #3a2a1a;
            --text-light: #6b5040;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
            transition: background 0.5s, color 0.5s;
        }
        
        .app-wrapper {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .theme-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            margin-left: 6px;
        }
        
        .theme-dot.dark { background: #1a1a1a; border-color: #444; }
        .theme-dot.light { background: #f5f0eb; border-color: #d4c5b5; }
        .theme-dot.active { border-color: var(--accent); }
        
        .badge {
            background: rgba(139,0,0,0.12);
            border: 1px solid rgba(139,0,0,0.25);
            padding: 6px 14px;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
        }
        
        .game-container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 35px 40px;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }
        
        .game-title {
            font-family: 'Crimson Text', serif;
            color: var(--accent);
            font-size: 22px;
            letter-spacing: 6px;
        }
        
        .status-pills {
            display: flex;
            gap: 15px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text-light);
        }
        
        .location {
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 22px;
        }
        
        .scene-text {
            font-size: 16px;
            line-height: 2.3;
            color: var(--text);
            margin-bottom: 22px;
        }
        
        .dialogue-box {
            padding: 16px 20px;
            margin-bottom: 28px;
            border-right: 3px solid var(--accent);
            background: linear-gradient(90deg, rgba(139,0,0,0.05) 0%, transparent 100%);
            font-style: italic;
            color: var(--text-light);
            line-height: 2.2;
            border-radius: 0 3px 3px 0;
        }
        
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .choice-btn {
            width: 100%;
            text-align: right;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px 18px;
            font-family: var(--font-main);
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 3px;
        }
        
        .choice-btn:hover {
            border-color: var(--accent);
            color: #fff;
            transform: translateX(-4px);
        }
        
        .game-footer {
            margin-top: 25px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-light);
            opacity: 0.5;
        }
        
        @media (max-width: 600px) {
            .game-container { padding: 25px 18px; }
            .game-title { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="top-bar">
            <span class="badge">پروندهٔ فعال</span>
            <div>
                <span class="theme-dot dark active" onclick="setTheme('dark')"></span>
                <span class="theme-dot light" onclick="setTheme('light')"></span>
            </div>
        </div>
        
        <div class="game-container">
            <div class="game-header">
                <div class="game-title">آخرین صلیب</div>
                <div class="status-pills">
                    <span id="clueCount">سرنخ: ۰</span>
                    <span id="timeDisplay">روز: ۱</span>
                </div>
            </div>
            
            <div class="location" id="location"></div>
            <div class="scene-text" id="sceneText"></div>
            <div class="dialogue-box" id="dialogue"></div>
            <div class="choices" id="choices"></div>
            
            <div class="game-footer">
                نورثبروک، اورگن
            </div>
        </div>
    </div>
    
    <script>
        function setTheme(theme) {
            document.body.className = theme === 'light' ? 'theme-light' : '';
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
            document.querySelector('.theme-dot.' + theme).classList.add('active');
        }
    </script>
    
    <script src="story.js"></script>
</body>
</html>
