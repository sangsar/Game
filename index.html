<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آخرین صلیب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #c0c0c0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            max-width: 650px;
            width: 100%;
            background: #111111;
            border: 1px solid #2a2a2a;
            padding: 35px;
            border-radius: 4px;
        }
        .game-title {
            text-align: center;
            color: #8b0000;
            font-size: 22px;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }
        .location {
            color: #8b0000;
            font-size: 13px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        .scene-text {
            line-height: 2;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .dialogue {
            color: #b0b0b0;
            margin-bottom: 20px;
            padding-right: 12px;
            border-right: 2px solid #3a1a1a;
            line-height: 2;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
        }
        .choice-btn {
            background: #1a1a1a;
            color: #c0c0c0;
            border: 1px solid #333;
            padding: 12px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-align: right;
            transition: 0.3s;
        }
        .choice-btn:hover {
            background: #222;
            border-color: #8b0000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-title">آخرین صلیب</div>
        <div class="location" id="location"></div>
        <div class="scene-text" id="sceneText"></div>
        <div class="dialogue" id="dialogue"></div>
        <div class="choices" id="choices"></div>
    </div>
    
    <script src="story.js"></script>
    <script>
        let gameState = {
            time: 0,
            trust: 5,
            clues: [],
            stress: 0,
            currentScene: 'scene1'
        };
        
        function loadScene(sceneId) {
            const scene = story[sceneId];
            document.getElementById('location').innerHTML = scene.location;
            document.getElementById('sceneText').innerHTML = scene.text;
            document.getElementById('dialogue').innerHTML = scene.dialogue;
            
            let html = '';
            for (let i = 0; i < scene.choices.length; i++) {
                html += `<button class="choice-btn" onclick="choose(${i})">${scene.choices[i].label}</button>`;
            }
            document.getElementById('choices').innerHTML = html;
            
            gameState.currentScene = sceneId;
        }
        
        function choose(index) {
            const scene = story[gameState.currentScene];
            const choice = scene.choices[index];
            
            if (choice.clue) gameState.clues.push(choice.clue);
            if (choice.trust) gameState.trust += choice.trust;
            if (choice.time) gameState.time += choice.time;
            if (choice.stress) gameState.stress += choice.stress;
            
            loadScene(choice.next);
        }
        
        loadScene('scene1');
    </script>
</body>
</html>
