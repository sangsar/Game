<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>آشفیلد | پرونده‌ی سایه (بخش ۱)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at 20% 10%, #0a0505, #020101);
            font-family: 'Courier New', monospace;
            color: #cfc5b8;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 1;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(10, 6, 6, 0.88);
            backdrop-filter: blur(5px);
            border-radius: 36px;
            border: 1px solid #6a2e2e;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        .header {
            background: rgba(0,0,0,0.7);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #a04030;
        }
        .header h1 { font-family: 'Times New Roman', serif; font-size: 1.9rem; letter-spacing: 3px; color: #d18f62; text-shadow: 0 0 6px #8a2a1a; }
        .header p { color: #b98a6a; font-size: 0.8rem; margin-top: 5px; }
        .story-box { background: rgba(0,0,0,0.55); padding: 25px; margin: 20px; border-radius: 28px; border-right: 5px solid #a53f2a; }
        .mood { font-size: 2rem; text-align: center; margin-bottom: 15px; color: #a55030; }
        .narrative { font-size: 1rem; line-height: 1.7; text-align: justify; }
        .crime-scene { background: #0f0606; margin: 20px 0; padding: 15px; border-radius: 20px; border-left: 3px solid #8a2a1a; font-style: italic; }
        .choices { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .choice-btn {
            background: #1c0f0f;
            border: 1px solid #7a4030;
            padding: 14px;
            font-size: 1rem;
            font-family: monospace;
            color: #ecd9c4;
            text-align: right;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        .choice-btn:hover { background: #402020; border-color: #c06a4a; transform: translateX(-6px); }
        .event-log { background: #1a0b0b; margin-top: 20px; padding: 15px; border-radius: 20px; border-right: 4px solid #c07050; font-size: 0.9rem; color: #efcfb0; max-height: 150px; overflow-y: auto; }
        .reset-btn {
            background: none;
            border: 1px solid #9a4a3a;
            padding: 8px 20px;
            margin: 15px 20px 20px auto;
            display: block;
            color: #dbaa80;
            border-radius: 30px;
            cursor: pointer;
        }
        footer { text-align: center; font-size: 0.7rem; padding: 16px; color: #6a4a3a; border-top: 1px solid #3a1e1e; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🩸 آشفیلد: پرونده‌ی سایه</h1>
        <p>بخش ۱ – اولین خون | هر انتخاب تو سرنوشت پرونده را تغییر می‌دهد</p>
    </div>
    <div class="story-box">
        <div class="mood">🌧️🕯️</div>
        <div id="narrative" class="narrative"></div>
        <div id="crimeScene" class="crime-scene"></div>
        <div id="choices" class="choices"></div>
        <div id="eventLog" class="event-log">📋 وقایع مهم بعداً اینجا نمایش داده می‌شوند...</div>
    </div>
    <button id="resetBtn" class="reset-btn">🗑️ بازنشانی پرونده (شروع از نو)</button>
    <footer>🔪 عواقب انتخاب‌هایت چند قدم بعد خودش را نشان می‌دهد. به حرف‌های ساده هم توجه کن.</footer>
</div>
<script>
    let step = 0;
    let gameActive = true;
    let flags = {
        hadCoffeeWithPartner: false,
        trustedHusbandEarly: false,
        checkedTheater: false,
        warnedVictim: false,
        evidenceFound: 0,
        victimsKilled: 1,
        relationshipWithLina: 0,
        alertedBrothers: false
    };
    let pendingEvents = [];

    function saveGame() {
        let save = { step: step, flags: flags, pending: pendingEvents };
        localStorage.setItem('AshfieldPart1', JSON.stringify(save));
    }
    function loadGame() {
        let raw = localStorage.getItem('AshfieldPart1');
        if (!raw) return false;
        try {
            let data = JSON.parse(raw);
            step = data.step;
            flags = data.flags;
            pendingEvents = data.pending || [];
            return true;
        } catch(e) { return false; }
    }
    function addLog(msg) {
        pendingEvents.push(msg);
        let logDiv = document.getElementById('eventLog');
        logDiv.innerHTML = "📋 آخرین رویدادها:<br>" + pendingEvents.slice(-5).join("<br>");
    }

    const stages = [];
    // مرحله 1
    stages.push({
        narrative: `من الکس ریدم، کارآگاه بخش جنایی. تازه وارد شهر آشفیلد شدم. هشت هزار نفر، بارون می‌باره، مه غلیظ. اولین روز سر کار با همکارم «لینا کاستیلو» آشنا می‌شم.`,
        scene: `لینا یه زن ۳۵ ساله با چشمان خسته. میگه: «خوش اومدی، آشفیلد آدم رو زود فرسوده می‌کنه. راستی، قهوه می‌خوری؟»`,
        options: [
            { text: "A) آره، بریم یه قهوه بخوریم.", effect: () => { flags.hadCoffeeWithPartner = true; addLog("✅ با لینا قهوه خوردی. اعتماد بیشتری بهت پیدا کرد."); } },
            { text: "B) نه وقتش نیست.", effect: () => { addLog("❌ لینا دلخور شد. فکر می‌کنه بی‌محلی کردی."); } }
        ]
    });
    // مرحله 2
    stages.push({
        narrative: `فردا صبح، خبر می‌رسه جسد زنی ۲۹ ساله به اسم «سارا داناگوان» پشت انبار کامیون‌ها پیدا شده.`,
        scene: `ضربات چاقوی صاف‌کن (کاردک گچ‌بری). کنار دستش یه مداد شمعی قرمز. لینا میگه: «نظرت چیه؟ شوهرش رو اول بازجویی کنیم یا بریم سراغ سابقه‌ی کاریش؟»`,
        options: [
            { text: "A) شوهرش توماس رو اول بازجویی کن.", effect: () => { flags.trustedHusbandEarly = true; addLog("🔍 توماس رو زیر ذره‌بین گذاشتی."); } },
            { text: "B) بریم سراغ کارگاه تئاتر شهر.", effect: () => { flags.checkedTheater = true; addLog("🎭 تئاتر تعطیله ولی چند درام‌نویس عجیب اون رفت و آمد دارن."); } }
        ]
    });
    // مرحله 3
    stages.push({
        narrative: `یک هفته بعد، جسد دوم: جیک وب، مکانیک. توی ماشین خودش تو پارکینگ کافه. مداد شمعی آبی.`,
        scene: `زیر ناخن‌های جیک خاک‌اره و موی حیوان. لینا میگه: «به نظرت ربط داره؟ من یه حسی دارم...»`,
        options: [
            { text: "A) باهاش حرف بزن و بگو بهت اعتماد داری.", effect: () => { if(flags.hadCoffeeWithPartner) { addLog("💬 لینا میگه شوهر سارا رو شب قتل تو پارک دیده."); flags.evidenceFound++; } else { addLog("🤐 لینا حرفی نمیزنه."); } } },
            { text: "B) حرفش رو قطع کن و بگو برو مدارک رو چک کن.", effect: () => { addLog("😞 لینا ناراحت شد."); } }
        ]
    });
    // مرحله 4
    stages.push({
        narrative: `مدرکی علیه توماس پیدا می‌شه: یه چاقوی صاف‌کن توی انباریش، با لکه خون.`,
        scene: `توماس میگه مال منه برای کار نجاری. لینا میگه «به نظر کافیه براش قرار بازداشت بذاریم.»`,
        options: [
            { text: "A) دستور بازداشت بده.", effect: () => { if(flags.trustedHusbandEarly) { addLog("⚠️ توماس بازداشت شد. اما چند روز بعد قتل سوم رخ می‌دهد. پس توماس بی‌گناه است!"); flags.victimsKilled++; } else { addLog("توماس بازداشت شد."); } } },
            { text: "B) صبر کنیم، ممکنه جاسازی شده باشه.", effect: () => { addLog("با احتیاط جلو رفتی."); } }
        ]
    });
    // مرحله 5
    stages.push({
        narrative: `لینا یک شب میگه: «الکس، بعد از کار می‌ای یه فیلم ببینیم؟ خسته‌ام.»`,
        scene: `چشمانش خسته است.`,
        options: [
            { text: "A) باشه، بریم سینما.", effect: () => { flags.relationshipWithLina++; addLog("🎬 باهاش رفتی سینما. فردا یک سرنخ جدید بهت داد."); flags.evidenceFound++; } },
            { text: "B) نه، نمی‌تونم.", effect: () => { flags.relationshipWithLina--; addLog("😔 لینا تنها رفت."); } }
        ]
    });
    // مرحله 6 تا 25 به صورت خلاصه (برای حفظ فضا، ۲۰ مرحله دیگر با منطق مشابه اما با اعداد متفاوت)
    for(let i=6; i<=25; i++) {
        stages.push({
            narrative: `مرحله ${i}: ادامه تحقیقات... (در نسخه نهایی داستان کامل است)`,
            scene: `مدرک جدید یا مکالمه ساده.`,
            options: [
                { text: "A) انتخاب اول", effect: () => { addLog(`تأخیری بعداً مشخص می‌شود.`); flags.evidenceFound++; } },
                { text: "B) انتخاب دوم", effect: () => { addLog(`تأخیری بعداً مشخص می‌شود.`); } }
            ]
        });
    }

    function renderStage() {
        if (!gameActive || step >= stages.length) {
            endPartOne();
            return;
        }
        const s = stages[step];
        document.getElementById('narrative').innerHTML = s.narrative;
        document.getElementById('crimeScene').innerHTML = s.scene;
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        s.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = opt.text;
            btn.addEventListener('click', () => {
                opt.effect();
                step++;
                saveGame();
                renderStage();
            });
            choicesDiv.appendChild(btn);
        });
    }

    function endPartOne() {
        gameActive = false;
        document.getElementById('narrative').innerHTML = `🔚 پایان بخش اول. انتخاب‌هایت کم‌کم نتیجه می‌دهند. برای ادامه، بخش دوم را باز کن.`;
        document.getElementById('crimeScene').innerHTML = `📊 آمار: ${flags.victimsKilled} قربانی، مدرک: ${flags.evidenceFound}`;
        document.getElementById('choices').innerHTML = '';
        saveGame();
    }

    function resetGame() {
        step = 0;
        gameActive = true;
        flags = { hadCoffeeWithPartner: false, trustedHusbandEarly: false, checkedTheater: false, warnedVictim: false, evidenceFound: 0, victimsKilled: 1, relationshipWithLina: 0, alertedBrothers: false };
        pendingEvents = [];
        localStorage.removeItem('AshfieldPart1');
        renderStage();
        document.getElementById('eventLog').innerHTML = "📋 وقایع مهم بعداً اینجا نمایش داده می‌شوند...";
        saveGame();
    }

    if (!loadGame()) resetGame();
    else renderStage();
    document.getElementById('resetBtn').addEventListener('click', resetGame);
</script>
<!-- پایان بخش ۱ --><!-- ==================== بخش ۲ شروع ==================== -->
<script>
    // ادامه از بخش ۱ - مرحله ۲۶ تا ۵۰
    // (توجه: این کد باید بعد از بخش ۱ در همان فایل قرار گیرد)
    
    // اگر بازی در بخش ۱ به پایان رسیده بود، دوباره فعالش می‌کنیم
    if (typeof gameActive !== 'undefined' && gameActive === false) {
        gameActive = true;
    }
    // اگر متغیرها تعریف نشده بودند (در صورتی که مستقیم از بخش ۲ شروع کنیم)، از localStorage می‌خوانیم
    if (typeof flags === 'undefined') {
        let saved = localStorage.getItem('AshfieldPart1');
        if (saved) {
            let data = JSON.parse(saved);
            step = data.step || 25;
            flags = data.flags;
            pendingEvents = data.pending || [];
        } else {
            // مقادیر پیش‌فرض
            step = 25;
            flags = {
                hadCoffeeWithPartner: false,
                trustedHusbandEarly: false,
                checkedTheater: false,
                warnedVictim: false,
                evidenceFound: 0,
                victimsKilled: 1,
                relationshipWithLina: 0,
                alertedBrothers: false
            };
            pendingEvents = [];
        }
    }
    
    // مراحل ۲۶ تا ۵۰ (۲۵ مرحله)
    const stagesPart2 = [];
    
    // مرحله 26 – قتل سوم و مظنون جدید
    stagesPart2.push({
        narrative: `قتل سوم: «دنی مِیفیلد»، ۴۰ ساله، صاحب یک گاراژ. جسدش توی گاراژ خودش پیدا شده. این بار مداد شمعی سبز.`,
        scene: `دنی با چاقوی صاف‌کن کشته شده. در گوشه گاراژ، یک دستکش کار پیدا می‌کنیم. اثر انگشت روی دستکش متعلق به «برادران میلر» است، دو معتاد محلی. لینا میگه: «حالا چی؟ دستکش مال اوناست.`],
        options: [
            { text: "A) برادران میلر رو بازداشت کن. اثر انگشت مدرک محکمه‌پسندیه.", effect: () => { addLog("🚔 برادران میلر دستگیر شدن. اما هر دو میگن دستکش مال اونها نیست. چند روز بعد، در حالی که در بازداشت هستند، قتل چهارم رخ می‌دهد. معلوم می‌شه اشتباه کردی."); flags.victimsKilled++; flags.alertedBrothers = true; } },
            { text: "B) صبر کن، ممکنه کسی دستکش رو جاسازی کرده باشه. برو سراغ فیلم دوربین‌های اطراف.", effect: () => { addLog("🔍 دوربین‌های خیابانی نشون میدن یک نفر شب قبل دستکش رو انداخته پشت گاراژ. ولی صورتش پیدا نیست."); flags.evidenceFound++; } }
        ]
    });
    
    // مرحله 27
    stagesPart2.push({
        narrative: `لینا بعد از چند روز سکوت، میگه: «الکس، می‌دونم پرونده سخته، اما بیا یکم قدم بزنیم. هوای بارونی خیلی سنگین شده.»`,
        scene: `چشمانش منتظر جواب توست.`,
        options: [
            { text: "A) باشه، بریم قدم بزنیم. شاید ذهنمون باز بشه.", effect: () => { flags.relationshipWithLina++; addLog("🚶‍♂️ قدم زدید و حرف زدید. لینا از یک راز کوچک برات گفت: شوهر سارا قبلاً بهش پیامک می‌داده، ولی پاک کرده."); flags.evidenceFound++; } },
            { text: "B) نه، باید بمونم و مدارک رو بررسی کنم. تو برو.", effect: () => { flags.relationshipWithLina--; addLog("😔 لینا تنها رفت. فردا صبح با حالت بی‌تفاوتی بهت سلام کرد."); } }
        ]
    });
    
    // مرحله 28
    stagesPart2.push({
        narrative: `یک پیامک ناشناس می‌رسد: «قاتل رو تو گاراژ فراموش شده خیابان صنوبر پیدا می‌کنی. بیا تنها.»`,
        scene: `لینا میگه «ممکنه تله باشه. من میام باهات.»`,
        options: [
            { text: "A) برو تنها. نمی‌خوام لینا به خطر بیفته.", effect: () => { addLog("🏭 رفتی تنها. توی گاراژ کسی نبود. ولی یه آلبوم عکس از قربانیان پیدا کردی. شواهد جدید."); flags.evidenceFound++; } },
            { text: "B) باشه، باهم بریم. امنیت بیشتره.", effect: () => { addLog("👥 باهم رفتید. گاراژ خالی بود ولی یه تهدیدنامه روی دیوار نوشته شده: «پلیس رو دور کنید.»"); flags.relationshipWithLina++; } }
        ]
    });
    
    // مرحله 29
    stagesPart2.push({
        narrative: `مادر سارا داناگوان (قتل اول) خودکشی کرد. تو یادداشتش نوشته: «پلیس کاری نکرد، من تنها بودم.»`,
        scene: `لینا در حالی که اشک می‌ریزد میگوید: «تقصیر ما بود. اگه زودتر قاتل رو گرفته بودیم...»`,
        options: [
            { text: "A) لینا رو بغل کن و بگو «مقصر ما نیستیم، قاتله.»", effect: () => { flags.relationshipWithLina += 2; addLog("🫂 لینا گریه کرد اما احساس کرد تنها نیست. فردا صبح مصمم‌تر برگشت سر کار."); } },
            { text: "B) ساکت بمان و برو سراغ مدارک. شاید این حس برات ضعف باشه.", effect: () => { flags.relationshipWithLina -= 1; addLog("😶 لینا از سکوت تو ناراحت شد. کمتر باهات حرف میزنه."); } }
        ]
    });
    
    // مرحله 30
    stagesPart2.push({
        narrative: `بازجویی از یکی از کارگران گاراژ: او میگه «یه مشتری همیشه میومد و با دنی بحث می‌کرد. یه آدم با لباس کار، صورتش رو نمیدیدم.»`,
        scene: `لینا یادداشت می‌کند: «شاید قاتل لباس کار می‌پوشه تا تو محیط گاراژ دیده نشه.»`,
        options: [
            { text: "A) برو سراغ فروشگاه‌های لباس کار شهر.", effect: () => { addLog("🧥 از سه تا فروشگاه لیست خریداران رو گرفتی. یکی از اسامی تکراری بود: «لئو فیشر» طراح صحنه."); flags.evidenceFound++; } },
            { text: "B) این سرنخ رو نادیده بگیر، شاید بی‌ربط باشه.", effect: () => { addLog("😤 هفته بعد یه کارگر گاراژ دیگه ناپدید شد. کاش اون سرنخ رو جدی گرفته بودی."); flags.victimsKilled++; } }
        ]
    });
    
    // مرحله 31
    stagesPart2.push({
        narrative: `لینا میگه: «الکس، امروز تولد منه. می‌خواستم باهات یه شام ساده بخورم. میای؟»`,
        scene: `لبخند میزنه ولی خستگی تو چشماش معلومه.`,
        options: [
            { text: "A) حتماً میام. تو این روزها خیلی بهم کمک کردی.", effect: () => { flags.relationshipWithLina += 2; addLog("🎂 رفتید شام. لینا از زندگیش گفت، از اینکه تنهاست. اعتمادش بهت بیشتر شد."); } },
            { text: "B) ببخشید لینا، وقت ندارم. پرونده اولویته.", effect: () => { flags.relationshipWithLina -= 2; addLog("💔 لینا ناراحت شد. روز بعد با صورتی بی‌حالت سر کار اومد."); } }
        ]
    });
    
    // مرحله 32
    stagesPart2.push({
        narrative: `خبر می‌رسد در حوالی تئاتر قدیمی، یک کیسه پلاستیکی با تکه‌های پارچه و مداد شمعی پیدا شده.`,

        scene: `صدای حرکت اشیاء از داخل میاد.`,
        options: [
            { text: "A) منتظر نیروی کمکی باشیم. امنیت اولویت داره.", effect: () => { addLog("⏳ ۲۰ دقیقه بعد نیروها رسیدن. اما وقتی وارد شدیم، کارلوس از راه پشتی فرار کرده بود."); } },
            { text: "B) خودمون بریم داخل. شانس غافلگیر کردنش رو داریم.", effect: () => { addLog("💥 وارد شدیم. کارلوس سعی کرد فرار کنه اما با همکاری لینا گیرش انداختیم. دستگیر شد."); flags.evidenceFound++; } }
        ]
    });

    // مرحله 78 – بازجویی نهایی
    stagesPart4.push({
        narrative: `کارلوس توی بازجویی میگه: «من نمی‌خواستم بکشم. این لئو بود که ذهن من رو خراب کرد. من فقط از روی ترس ادامه دادم...»`,
        scene: `لینا با ناباوری نگاه می‌کنه. میگه: «به نظرت راست میگه؟»`,
        options: [
            { text: "A) نه، این فقط یه بهانه‌ست. او مسئول اعمالشه.", effect: () => { addLog("⚖️ کارلوس محکوم شد. پرونده بسته شد. لینا نفس راحتی کشید."); } },
            { text: "B) شاید واقعاً تحت تأثیر لئو بوده. مغزش رو شستشو داده.", effect: () => { addLog("🤔 چند ماه بعد، کارلوس در زندان خودکشی کرد. لینا گفت شاید اگر زودتر کمکش می‌کردیم، این اتفاق نمی‌افتاد."); } }
        ]
    });

    // مرحله 79
    stagesPart4.push({
        narrative: `پرونده داره بسته میشه. لینا پیشنهاد میده که بریم یه جای آروم، چند روزی استراحت کنیم.`,
        scene: `لبخند میزنه، ولی هنوز رد خستگی تو چشماش هست.`,
        options: [
            { text: "A) باشه، باهات میام. هر دو به استراحت نیاز داریم.", effect: () => { addLog("🏞️ چند روز رفتید کنار دریاچه. لینا تعریف کرد که چطور این پرونده روش تأثیر گذاشته. باهات صمیمی‌تر شد."); flags.relationshipWithLina += 3; } },
            { text: "B) نه، باید گزارش نهایی رو بنویسم. بعداً.", effect: () => { addLog("😐 لینا تنها رفت. ارتباطتون سردتر شد."); flags.relationshipWithLina -= 2; } }
        ]
    });

    // مرحله 80 – سوال ساده روزمره (آخرین تصمیم عاطفی)
    stagesPart4.push({
        narrative: `گزارش رو نوشتی. لینا میاد خونه‌ات با یک بطری شراب. میگه: «می‌خوام یه چیزی بهت بگم. راستش من بهت علاقه دارم. فراتر از همکاری کاری.»`,
        scene: `نگاهش جدیه.`,
        options: [
            { text: "A) منم همین حس رو دارم لینا. بیا با هم بمونیم.", effect: () => { addLog("💕 با هم شروع کردید. زندگی مشترک آرومی داشتید. لینا همیشه میگفت تو بهترین همکار زندگیش بودی."); flags.relationshipWithLina = 10; } },
            { text: "B) لینا، من تو رو به عنوان همکار دوست دارم. بیا حرفه‌ای بمونیم.", effect: () => { addLog("🤝 لینا ناراحت شد اما احترام گذاشت. مدتی بعد از اداره منتقل شد."); flags.relationshipWithLina = 5; } }
        ]
    });

    // مرحله 81 تا 100 – جزییات پایانی و تأثیر انتخاب‌ها بر پایان نهایی
    for(let i=81; i<=100; i++) {
        let extraText = "";
        if (i === 90) extraText = "دادگاه برگزار شد. کارلوس به حبس ابد محکوم شد.";
        if (i === 95) extraText = "خانواده قربانیان از تو تشکر کردند. اما بعضی‌ها هنوز عصبانی بودن.";
        if (i === 100) extraText = "آخرین صفحه پرونده بسته شد. شهر آشفیلد به آرامش رسید.";
        stagesPart4.push({
            narrative: `مرحله ${i}: پایان پرونده در حال شکل‌گیری است. ${extraText}`,
            scene: i === 100 ? "لینا رو به تو می‌کند و میگوید: «آروم باش، کار تموم شد.»" : "یک مکالمه معمولی یا یک تصمیم نهایی...",
            options: [
                { text: "A) با آرامش و منطق", effect: () => { addLog(`مرحله ${i}: انتخاب تو باعث شد که پرونده با موفقیت بسته شود.`); } },
                { text: "B) با عجله و استرس", effect: () => { addLog(`مرحله ${i}: کمی عجله کردی، اما بالاخره به نتیجه رسیدی.`); } }
            ]
        });
    }

    // اضافه کردن مراحل بخش ۴ به آرایه اصلی stages
    if (typeof stages !== 'undefined') {
        stages.push(...stagesPart4);
    } else {
        var stages = stagesPart4;
        var step = step || 75;
        var gameActive = true;
    }

    // تابع پایان نهایی (بخش ۴)
    function finalEnding() {
        gameActive = false;
        let endingMessage = "";
        // تعیین پایان بر اساس شاخص‌ها
        if (flags.evidenceFound >= 8 && flags.relationshipWithLina >= 8) {
            endingMessage = `🎉 پایان عالی: تو و لینا نه تنها قاتل را دستگیر کردید، بلکه به هم اعتماد کردید و زندگی مشترک موفقی داشتید. پرونده «آشفیلد» به عنوان یکی از بزرگ‌ترین موفقیت‌های پلیس ثبت شد. 🏆`;
        } else if (flags.evidenceFound >= 6 && flags.victimsKilled <= 4) {
            endingMessage = `👍 پایان خوب: قاتل دستگیر شد، اما رابطه‌ات با لینا حرفه‌ای ماند. تو به عنوان کارآگاه ارشد منصوب شدی. آشفیلد نفس راحتی کشید.`;
        } else if (flags.victimsKilled > 5) {
            endingMessage = `😔 پایان تلخ: قاتل بالاخره دستگیر شد، اما خیلی دیر. تعداد قربانیان زیاد بود. لینا از تو دلخور شد و به شهر دیگری منتقل شد. یادش همیشه برایت تلخ خواهد ماند.`;
        } else {
            endingMessage = `🔚 پایان مبهم: قاتل فرار کرد و پرونده باز ماند. تو به شهر دیگری منتقل شدی. اما هر شب صدای باران آشفیلد تو را آزار می‌دهد. آیا روزی حقیقت فاش خواهد شد؟`;
        }
        if (document.getElementById('narrative')) {
            document.getElementById('narrative').innerHTML = `🏁 پایان پرونده «آشفیلد» 🏁<br>${endingMessage}`;
            document.getElementById('crimeScene').innerHTML = `📊 آمار نهایی: قربانیان: ${flags.victimsKilled} | مدارک جمع‌آوری شده: ${flags.evidenceFound} | رابطه با لینا: ${flags.relationshipWithLina}`;
            document.getElementById('choices').innerHTML = '';
            document.getElementById('eventLog').innerHTML += "<br><br>🔚 پرونده بسته شد. دکمه بازنشانی را بزنید تا دوباره شروع کنید.";
        }
        saveGame();
    }

    // بازنویسی تابع renderStage برای پایان نهایی
    if (typeof window.renderStage !== 'function') {
        window.renderStage = function() {
            if (!gameActive || step >= stages.length) {
                finalEnding();
                return;
            }
            const s = stages[step];
            if (document.getElementById('narrative')) {
                document.getElementById('narrative').innerHTML = s.narrative;
                document.getElementById('crimeScene').innerHTML = s.scene;
                const choicesDiv = document.getElementById('choices');
                choicesDiv.innerHTML = '';
                s.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = opt.text;
                    btn.addEventListener('click', () => {
                        opt.effect();
                        step++;
                        saveGame();
                        window.renderStage();
                    });
                    choicesDiv.appendChild(btn);
                });
            }
        };
    }

    // ذخیره نهایی برای بخش ۴
    function saveGame() {
        let save = { step: step, flags: flags, pending: pendingEvents };
        localStorage.setItem('AshfieldPart4', JSON.stringify(save));
        localStorage.setItem('AshfieldPart3', JSON.stringify(save));
        localStorage.setItem('AshfieldPart2', JSON.stringify(save));
        localStorage.setItem('AshfieldPart1', JSON.stringify(save));
    }

    // اگر صفحه تازه بارگذاری شده، مراحل را رندر کن
    if (typeof window !== 'undefined' && document.getElementById('narrative')) {
        const resetBtn = document.getElementById('resetBtn');
        if (resetBtn) {
            const newResetBtn = resetBtn.cloneNode(true);
            resetBtn.parentNode.replaceChild(newResetBtn, resetBtn);
            newResetBtn.addEventListener('click', () => {
                // بازنشانی کامل به ابتدای بخش ۱ (مرحله ۰)
                step = 0;
                gameActive = true;
                flags = {
                    hadCoffeeWithPartner: false,
                    trustedHusbandEarly: false,
                    checkedTheater: false,
                    warnedVictim: false,
                    evidenceFound: 0,
                    victimsKilled: 1,
                    relationshipWithLina: 0,
                    alertedBrothers: false
                };
                pendingEvents = [];
                // پاک کردن همه ذخیره‌ها
                localStorage.removeItem('AshfieldPart1');
                localStorage.removeItem('AshfieldPart2');
                localStorage.removeItem('AshfieldPart3');
                localStorage.removeItem('AshfieldPart4');
                // بارگذاری مجدد صفحه برای شروع دوباره از بخش ۱
                location.reload();
            });
        }
        // اگر مرحله فعلی نامعتبر است، از اول بخش ۴ شروع کن (یا ادامه بده)
        if (step < 75) step = 75;
        if (step >= stages.length) {
            finalEnding();
        } else {
            window.renderStage();
        }
    }
</script>
<!-- پایان بخش ۴ -->
</body>
</html>
